<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTsN 14 Jakarta - Digital Snake & Ladder</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            navy: '#0F172A',
                            blue: '#1E3A8A',
                            teal: '#0D9488',
                            gold: '#F59E0B',
                            light: '#F0F9FF'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; overflow-x: hidden; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }
        .board-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #fff;
            border: 4px solid #0F172A;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        .board-cell {
            border: 1px solid rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: rgba(0,0,0,0.3);
            position: relative;
        }
        .cell-odd { background-color: #e0f2fe; }
        .cell-even { background-color: #f0fdf4; }
        
        .player-token {
            position: absolute;
            width: 80%;
            height: 80%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }
        .offset-0 { transform: translate(-20%, -20%); z-index: 15; }
        .offset-1 { transform: translate(20%, -20%); z-index: 14; }
        .offset-2 { transform: translate(-20%, 20%); z-index: 13; }
        .offset-3 { transform: translate(20%, 20%); z-index: 12; }
        .snake-line { stroke: #ef4444; stroke-width: 4; stroke-dasharray: 5,5; fill: none; opacity: 0.7;}
        .ladder-line { stroke: #10b981; stroke-width: 6; opacity: 0.7; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">

        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'mtsn14-snake-ladder-app';
        const firebaseConfig = {
            apiKey: "AIzaSyA3v19W60OQ5qfKYELEvmmkKaO-Gf6zHgs",
            authDomain: "informatica-class.firebaseapp.com",
            projectId: "informatica-class",
            storageBucket: "informatica-class.firebasestorage.app",
            messagingSenderId: "352869091816",
            appId: "1:352869091816:web:394d41abf183c63d2bbc5d",
            measurementId: "G-E5QK6W2JR9"
        };
        
        let app, db, auth;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (e) {
            console.error("Firebase init failed", e);
        }

        const SUBJECTS = [
            "Informatika", "Bahasa Indonesia", "Bahasa Inggris", "Matematika", 
            "IPA", "IPS", "PPKn", "Al-Qur'an Hadis", "Akidah Akhlak", 
            "Fikih", "SKI", "Bahasa Arab", "PJOK", "Seni Budaya", "Prakarya"
        ];

        const AVATARS = [
            { id: 'a1', name: 'Student Boy - Peci', icon: '👦🏽', bg: 'bg-blue-500' },
            { id: 'a2', name: 'Student Boy - Glasses', icon: '🤓', bg: 'bg-indigo-500' },
            { id: 'a3', name: 'Student Boy - Headset', icon: '🎧', bg: 'bg-purple-500' },
            { id: 'a4', name: 'Student Boy - Sport', icon: '⚽', bg: 'bg-green-500' },
            { id: 'a5', name: 'Student Boy - Scientist', icon: '👨‍🔬', bg: 'bg-teal-500' },
            { id: 'a6', name: 'Student Boy - Programmer', icon: '👨‍💻', bg: 'bg-gray-700' },
            { id: 'a7', name: 'Student Boy - Artist', icon: '👨‍🎨', bg: 'bg-orange-500' },
            { id: 'a8', name: 'Student Boy - Smart', icon: '🧠', bg: 'bg-red-500' },
            { id: 'a9', name: 'Student Girl - Hijab Blue', icon: '🧕', bg: 'bg-blue-400' },
            { id: 'a10', name: 'Student Girl - Hijab Pink', icon: '🧕🏻', bg: 'bg-pink-500' },
            { id: 'a11', name: 'Student Girl - Hijab Green', icon: '🧕🏽', bg: 'bg-emerald-500' },
            { id: 'a12', name: 'Student Girl - Glasses', icon: '👩‍🏫', bg: 'bg-purple-400' },
            { id: 'a13', name: 'Student Girl - Scientist', icon: '👩‍🔬', bg: 'bg-cyan-500' },
            { id: 'a14', name: 'Student Girl - Programmer', icon: '👩‍💻', bg: 'bg-slate-600' },
            { id: 'a15', name: 'Student Girl - Artist', icon: '👩‍🎨', bg: 'bg-rose-400' },
            { id: 'a16', name: 'Student Girl - Sport', icon: '🏸', bg: 'bg-lime-500' },
            { id: 'a17', name: 'Robot Student', icon: '🤖', bg: 'bg-gray-400' },
            { id: 'a18', name: 'AI Assistant', icon: '👽', bg: 'bg-green-400' },
            { id: 'a19', name: 'Astronaut', icon: '👨‍🚀', bg: 'bg-blue-900' },
            { id: 'a20', name: 'Young Explorer', icon: '🕵️', bg: 'bg-amber-600' },
            { id: 'a21', name: 'Islamic Scholar', icon: '🕌', bg: 'bg-emerald-700' },
            { id: 'a22', name: 'Math Genius', icon: '📐', bg: 'bg-indigo-600' },
            { id: 'a23', name: 'Nature Lover', icon: '🌱', bg: 'bg-green-600' },
            { id: 'a24', name: 'Bookworm', icon: '📚', bg: 'bg-yellow-600' },
            { id: 'a25', name: 'Tech Ninja', icon: '🥷', bg: 'bg-black' },
            { id: 'a26', name: 'Super Student', icon: '🦸', bg: 'bg-red-600' },
            { id: 'a27', name: 'Creative Mind', icon: '💡', bg: 'bg-yellow-400' },
            { id: 'a28', name: 'Language Star', icon: '🗣️', bg: 'bg-sky-500' },
            { id: 'a29', name: 'History Buff', icon: '🏺', bg: 'bg-stone-500' },
            { id: 'a30', name: 'Music Talent', icon: '🎸', bg: 'bg-fuchsia-500' },
            { id: 'a31', name: 'Cyber Cadet', icon: '🕶️', bg: 'bg-cyan-700' },
            { id: 'a32', name: 'Future Leader', icon: '👑', bg: 'bg-amber-500' },
        ];

        // Generate robust sample base pool of 50 questions
        const generateDefault50Questions = (subject = "Informatika") => {
            const list = [];
            for (let i = 1; i <= 50; i++) {
                list.push({
                    id: i,
                    q: `(${subject}) Pertanyaan nomor ${i}: Konsep dasar materi pembelajaran interaktif MTsN 14 Jakarta?`,
                    options: [`Pilihan A soal ${i}`, `Pilihan B soal ${i}`, `Pilihan C soal ${i}`, `Pilihan D soal ${i}`],
                    answer: 0,
                    level: i % 3 === 0 ? "Sulit" : i % 2 === 0 ? "Sedang" : "Mudah",
                    subject: subject
                });
            }
            return list;
        };

        const DEFAULT_BOARD = {
            snakes: { 16: 6, 47: 26, 49: 11, 56: 53, 62: 19, 64: 60, 87: 24, 93: 73, 95: 75, 98: 78 },
            ladders: { 1: 38, 4: 14, 9: 31, 21: 42, 28: 84, 36: 44, 51: 67, 71: 91, 80: 100 }
        };

        window.ReactApp = function() {
            const { useState, useEffect, useMemo } = React;

            const [user, setUser] = useState(null);
            const [userRole, setUserRole] = useState(null); 
            const [currentView, setCurrentView] = useState('landing'); // landing, teacher_dash, admin_dash, question_bank, analytics, join_room, lobby, playing, finished
            
            const [roomData, setRoomData] = useState(null);
            const [roomId, setRoomId] = useState(null);
            const [playerData, setPlayerData] = useState(null); 
            const [toast, setToast] = useState(null);
            const [loading, setLoading] = useState(true);

            // Password Modals State
            const [teacherModalOpen, setTeacherModalOpen] = useState(false);
            const [teacherPassword, setTeacherPassword] = useState('');
            const [adminModalOpen, setAdminModalOpen] = useState(false);
            const [adminPassword, setAdminPassword] = useState('');

            // Teachers Management (for Admin)
            const [teachersList, setTeachersList] = useState([
                { id: 1, name: 'Ust. Ahmad, S.Pd', subject: 'Informatika', username: 'guru_informatika', pass: 'guru123' },
                { id: 2, name: 'Siti Rahma, M.Pd', subject: 'Matematika', username: 'guru_matematika', pass: 'guru123' },
                { id: 3, name: 'Budi Santoso, S.Ag', subject: 'Fikih', username: 'guru_fikih', pass: 'guru123' }
            ]);
            const [newTeacher, setNewTeacher] = useState({ name: '', subject: 'Informatika', username: '', pass: '' });

            // Question Bank State
            const [selectedSubject, setSelectedSubject] = useState('Informatika');
            const [questionBank, setQuestionBank] = useState(() => generateDefault50Questions('Informatika'));
            
            // AI Generator State
            const [aiModalOpen, setAiModalOpen] = useState(false);
            const [aiSubject, setAiSubject] = useState('Informatika');
            const [aiClass, setAiClass] = useState('Kelas 8');
            const [aiMaterial, setAiMaterial] = useState('Literasi Digital');
            const [aiCount, setAiCount] = useState(50);
            const [aiDifficulty, setAiDifficulty] = useState('Sedang');
            const [aiLoading, setAiLoading] = useState(false);

            // Reports / History state
            const [gameHistory, setGameHistory] = useState([
                { id: 'ROOM-1401', date: '25 Sep 2026', subject: 'Informatika', playersCount: 28, winner: 'Ahmad' },
                { id: 'ROOM-1402', date: '24 Sep 2026', subject: 'Matematika', playersCount: 30, winner: 'Siti' }
            ]);

            const showToast = (msg, type = 'info') => {
                setToast({msg, type});
                setTimeout(() => setToast(null), 3000);
            };

            const generateQuestionsWithAI = () => {
                setAiLoading(true);
                setTimeout(() => {
                    const generated = [];
                    for(let i=1; i<=aiCount; i++) {
                        generated.push({
                            id: Date.now() + i,
                            q: `[AI - ${aiSubject}] Soal uji ${aiMaterial} #${i} (${aiDifficulty})?`,
                            options: [`Opsi Utama A`, `Opsi B`, `Opsi C`, `Opsi D`],
                            answer: 0,
                            level: aiDifficulty,
                            subject: aiSubject
                        });
                    }
                    setQuestionBank(prev => [...generated, ...prev]);
                    setAiLoading(false);
                    setAiModalOpen(false);
                    showToast(`Berhasil generate ${aiCount} soal AI untuk ${aiSubject}!`, "success");
                }, 1200);
            };

            useEffect(() => {
                if(!auth) { setLoading(false); return; }
                const initAuth = async () => {
                    const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                    try {
                        if (token) {
                            await signInWithCustomToken(auth, token).catch(() => signInAnonymously(auth));
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (e) {
                        await signInAnonymously(auth);
                    }
                };
                const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                    setUser(currentUser);
                    setLoading(false);
                });
                initAuth();
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user || !roomId || !db) return;
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                const unsubscribe = onSnapshot(roomRef, (snapshot) => {
                    if (snapshot.exists()) {
                        setRoomData(snapshot.data());
                    } else {
                        showToast("Room ditutup", "error");
                        setRoomId(null);
                        setRoomData(null);
                        setCurrentView(userRole === 'teacher' ? 'teacher_dash' : 'landing');
                    }
                });
                return () => unsubscribe();
            }, [user, roomId]);

            const createRoom = async () => {
                if (!user) return;
                try {
                    const newRoomId = 'MT14-' + Math.random().toString(36).substring(2, 6).toUpperCase();
                    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', newRoomId);
                    
                    const pool = questionBank.length >= 50 ? questionBank : generateDefault50Questions(aiSubject);
                    
                    const initialRoomData = {
                        id: newRoomId,
                        status: 'lobby',
                        hostId: user.uid,
                        config: { timer: 30, wrongPenalty: 0, maxPlayers: 32, subject: aiSubject },
                        board: DEFAULT_BOARD,
                        questions: pool.sort(() => 0.5 - Math.random()).slice(0, 50),
                        players: [],
                        turnIndex: 0,
                        turnState: 'idle',
                        currentDice: null,
                        createdAt: Date.now()
                    };

                    await setDoc(roomRef, initialRoomData);
                    setRoomId(newRoomId);
                    setUserRole('teacher');
                    setCurrentView('lobby');
                    showToast(`Room ${newRoomId} berhasil dibuat!`, "success");
                } catch (e) {
                    showToast("Gagal buat room: " + e.message, "error");
                }
            };

            const joinRoom = async (code, playerName, avatarId) => {
                if (!user) return;
                let rCode = code.toUpperCase().trim();
                if (!rCode.startsWith('MT14-') && rCode.length >= 4) rCode = 'MT14-' + rCode;

                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', rCode);
                try {
                    const snap = await getDoc(roomRef);
                    if (!snap.exists()) {
                        showToast(`Room ${rCode} tidak ditemukan!`, "error");
                        return;
                    }
                    const rData = snap.data();
                    if (rData.status !== 'lobby') {
                        showToast("Permainan sudah dimulai!", "error");
                        return;
                    }
                    if (rData.players.some(p => p.avatarId === avatarId)) {
                        showToast("Avatar sudah dipilih pemain lain!", "error");
                        return;
                    }

                    const newPlayer = {
                        id: user.uid,
                        name: playerName,
                        avatarId: avatarId,
                        position: 0,
                        score: 0,
                        correct: 0,
                        wrong: 0,
                        status: 'online'
                    };

                    await updateDoc(roomRef, { players: [...rData.players, newPlayer] });
                    setPlayerData(newPlayer);
                    setRoomId(rCode);
                    setUserRole('student');
                    setCurrentView('lobby');
                } catch (e) {
                    showToast("Gagal bergabung room", "error");
                }
            };

            const startGame = async () => {
                if (userRole !== 'teacher' || !roomData) return;
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                const startingPlayers = roomData.players.map(p => ({...p, position: 1}));
                await updateDoc(roomRef, { status: 'playing', players: startingPlayers, turnIndex: 0, turnState: 'idle' });
            };

            const submitAnswer = async (ansIdx) => {
                if (userRole !== 'student' || !roomData) return;
                const activeP = roomData.players[roomData.turnIndex];
                if (activeP.id !== user.uid) return;

                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                const qIdx = (roomData.turnIndex + activeP.correct + activeP.wrong) % roomData.questions.length;
                const q = roomData.questions[qIdx] || roomData.questions[0];
                const isCorrect = ansIdx === q.answer;

                let updated = [...roomData.players];
                let pIdx = roomData.turnIndex;

                if (isCorrect) {
                    showToast("Jawaban Benar! Silakan kocok dadu.", "success");
                    updated[pIdx].score += 100;
                    updated[pIdx].correct += 1;
                    await updateDoc(roomRef, { players: updated, turnState: 'rolling' });
                } else {
                    showToast("Jawaban Salah!", "error");
                    updated[pIdx].wrong += 1;
                    const nextTurn = (roomData.turnIndex + 1) % roomData.players.length;
                    await updateDoc(roomRef, { players: updated, turnIndex: nextTurn, turnState: 'idle' });
                }
            };

            const rollDice = async () => {
                if (!roomData) return;
                const activeP = roomData.players[roomData.turnIndex];
                if (userRole === 'student' && activeP.id !== user.uid) return;

                const diceVal = Math.floor(Math.random() * 6) + 1;
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                
                await updateDoc(roomRef, { currentDice: diceVal, turnState: 'moving' });

                setTimeout(async () => {
                    let newPos = activeP.position + diceVal;
                    if (newPos > 100) newPos = 100 - (newPos - 100);

                    let updated = [...roomData.players];
                    updated[roomData.turnIndex].position = newPos;
                    await updateDoc(roomRef, { players: updated, turnState: 'resolving' });

                    setTimeout(async () => {
                        let finalPos = newPos;
                        let hitEvent = false;

                        if (roomData.board.snakes[newPos]) {
                            finalPos = roomData.board.snakes[newPos];
                            hitEvent = 'snake';
                            updated[roomData.turnIndex].score -= 30;
                        } else if (roomData.board.ladders[newPos]) {
                            finalPos = roomData.board.ladders[newPos];
                            hitEvent = 'ladder';
                            updated[roomData.turnIndex].score += 50;
                        }

                        if (hitEvent) {
                            updated[roomData.turnIndex].position = finalPos;
                            showToast(hitEvent === 'ladder' ? 'Naik Tangga! +50' : 'Terkena Ular! -30', hitEvent === 'ladder' ? 'success' : 'error');
                        }

                        if (finalPos === 100) {
                            updated[roomData.turnIndex].score += 500;
                            await updateDoc(roomRef, { players: updated, status: 'finished' });
                        } else {
                            const nextTurn = (roomData.turnIndex + 1) % roomData.players.length;
                            await updateDoc(roomRef, { players: updated, turnIndex: nextTurn, turnState: 'idle' });
                        }
                    }, 1000);
                }, 1500);
            };

            const Button = ({ children, onClick, variant = 'primary', className = '', disabled=false }) => {
                const variants = {
                    primary: "bg-brand-gold text-white hover:bg-yellow-500",
                    secondary: "bg-brand-navy text-white hover:bg-slate-800",
                    outline: "border-2 border-brand-navy text-brand-navy hover:bg-brand-navy hover:text-white",
                    danger: "bg-red-500 text-white hover:bg-red-600",
                    success: "bg-green-500 text-white hover:bg-green-600"
                };
                return (
                    <button onClick={onClick} disabled={disabled} className={`px-6 py-3 rounded-full font-bold transition-all transform active:scale-95 shadow-lg flex items-center justify-center gap-2 ${variants[variant]} ${disabled ? 'opacity-50 cursor-not-allowed' : ''} ${className}`}>
                        {children}
                    </button>
                );
            };

            const Card = ({ children, className = '', onClick }) => (
                <div onClick={onClick} className={`glass-panel p-6 rounded-2xl ${onClick ? 'cursor-pointer' : ''} ${className}`}>
                    {children}
                </div>
            );

            // Views
            const LandingScreen = () => (
                <div className="min-h-screen flex flex-col items-center justify-center p-4 bg-slate-100 relative">
                    {/* Top Admin / Teacher Quick Access Bar */}
                    <div className="absolute top-4 right-4 flex gap-3">
                        <Button variant="outline" className="text-xs py-2 px-4" onClick={() => setTeacherModalOpen(true)}>🔐 Login Guru</Button>
                        <Button variant="secondary" className="text-xs py-2 px-4 bg-brand-navy text-white" onClick={() => setAdminModalOpen(true)}>🛡️ Admin Panel</Button>
                    </div>

                    <div className="text-center mb-10 max-w-2xl">
                        <div className="bg-brand-navy text-white text-sm font-bold px-4 py-1 rounded-full inline-block mb-4">MTs NEGERI 14 JAKARTA</div>
                        <h1 className="text-5xl md:text-6xl font-display font-bold text-brand-navy mb-4">DIGITAL <span className="text-brand-gold">SNAKE & LADDER</span></h1>
                        <p className="text-xl text-slate-600 font-medium">Belajar, Bermain, Berkompetisi!</p>
                    </div>
                    <div className="flex flex-col sm:flex-row gap-6 w-full max-w-md">
                        <Card className="flex-1 text-center border-t-4 border-t-brand-teal hover:-translate-y-2 transition-transform" onClick={() => setCurrentView('join_room')}>
                            <div className="text-4xl mb-4">🎓</div>
                            <h2 className="text-2xl font-bold text-brand-navy mb-2">Siswa</h2>
                            <p className="text-slate-500 text-sm">Masuk dengan Kode Room</p>
                        </Card>
                        <Card className="flex-1 text-center border-t-4 border-t-brand-gold hover:-translate-y-2 transition-transform" onClick={() => setTeacherModalOpen(true)}>
                            <div className="text-4xl mb-4">👨‍🏫</div>
                            <h2 className="text-2xl font-bold text-brand-navy mb-2">Guru</h2>
                            <p className="text-slate-500 text-sm">Dashboard & Bank Soal</p>
                        </Card>
                    </div>

                    {/* Teacher Password Modal */}
                    {teacherModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 p-4">
                            <div className="bg-white rounded-3xl p-8 max-w-sm w-full space-y-4 shadow-2xl">
                                <h3 className="text-xl font-bold text-brand-navy text-center">Autentikasi Guru</h3>
                                <p className="text-xs text-slate-500 text-center">Masukkan password untuk mengakses Dashboard Guru (Default: guru123)</p>
                                <input 
                                    type="password" 
                                    value={teacherPassword} 
                                    onChange={e => setTeacherPassword(e.target.value)} 
                                    placeholder="Password guru..." 
                                    className="w-full p-3 border rounded-xl text-center font-bold tracking-widest"
                                    autoFocus
                                    onKeyDown={e => {
                                        if(e.key === 'Enter') {
                                            if(teacherPassword === 'guru123') {
                                                setTeacherModalOpen(false);
                                                setTeacherPassword('');
                                                setUserRole('teacher');
                                                setCurrentView('teacher_dash');
                                                showToast("Berhasil masuk ke Dashboard Guru!", "success");
                                            } else {
                                                showToast("Password salah!", "error");
                                            }
                                        }
                                    }}
                                />
                                <div className="flex gap-2 pt-2">
                                    <Button variant="outline" className="flex-1 text-sm py-2" onClick={() => setTeacherModalOpen(false)}>Batal</Button>

                            const cCol = isEven ? col : 9 - col;
                            grid.push({ num: (row * 10) + cCol + 1, row, col: cCol });
                        }
                    }
                    return grid;
                }, []);

                const getCoords = (num) => {
                    const row = Math.floor((num - 1) / 10);

                                return (
                                    <div key={p.id} className={`player-token ${ava?.bg} ring-2 ring-white`} style={{ left: `${coord.col * 10}%`, top: `${coord.row * 10}%`, width: '10%', height: '10%' }}>
                                        <span className="text-xs">{ava?.icon}</span>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            const GamePlay = () => {
                if (!roomData) return null;
                const activeP = roomData.players[roomData.turnIndex];
                const isMyTurn = userRole === 'student' && activeP?.id === user.uid;
                const qIdx = activeP ? (roomData.turnIndex + activeP.correct + activeP.wrong) % roomData.questions.length : 0;
                const currentQ = roomData.questions[qIdx] || roomData.questions[0];

                return (
                    <div className="min-h-screen bg-slate-100 flex flex-col md:flex-row">
                        <div className="w-full md:w-80 bg-white border-r p-4 space-y-4">
                            <div className="bg-brand-navy text-white p-4 rounded-xl">
                                <div className="text-xs text-brand-gold">ROOM: {roomData.id}</div>
                                <h3 className="font-bold">MTsN 14 Jakarta Game</h3>
                            </div>
                            <h4 className="font-bold text-sm text-slate-500">KLASEMEN LIVE</h4>
                            <div className="space-y-2 max-h-[70vh] overflow-y-auto">
                                {[...roomData.players].sort((a,b) => b.position - a.position || b.score - a.score).map((p, i) => {
                                    const ava = AVATARS.find(a => a.id === p.avatarId);
                                    const isCur = roomData.turnIndex === roomData.players.findIndex(op => op.id === p.id);
                                    return (
                                        <div key={p.id} className={`p-2 rounded-xl border flex items-center gap-3 ${isCur ? 'border-brand-teal bg-teal-50' : 'bg-white'}`}>
                                            <div className="font-bold text-xs">{i+1}</div>
                                            <div className={`w-8 h-8 rounded-full ${ava?.bg} flex items-center justify-center text-sm`}>{ava?.icon}</div>
                                            <div className="flex-1 truncate text-xs">
                                                <div className="font-bold">{p.name}</div>
                                                <div className="text-slate-500">Pos: {p.position} | {p.score} pts</div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                        <div className="flex-1 p-6 flex flex-col items-center justify-between">
                            <div className="w-full bg-white p-4 rounded-xl shadow-sm flex justify-between items-center">
                                <div>
                                    <div className="text-xs text-slate-400 font-bold">GILIRAN SAAT INI</div>
                                    <div className="text-xl font-bold text-brand-navy">{activeP?.name}</div>
                                </div>
                                <div className="bg-brand-teal text-white w-12 h-12 rounded-full flex items-center justify-center font-bold text-xl">
                                    {roomData.currentDice || '🎲'}
                                </div>
                            </div>
                            <GameBoard roomData={roomData} />
                            {isMyTurn && roomData.turnState === 'idle' && (
                                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-70 p-4">
                                    <div className="bg-white rounded-3xl p-8 max-w-lg w-full space-y-6">
                                        <div className="bg-brand-gold text-white text-xs font-bold px-3 py-1 rounded-full inline-block">SOAL EVALUASI (50 Soal Random)</div>
                                        <h3 className="text-xl font-bold text-brand-navy">{currentQ.q}</h3>
                                        <div className="grid grid-cols-1 gap-3">
                                            {currentQ.options.map((opt, oIdx) => (
                                                <button key={oIdx} onClick={() => submitAnswer(oIdx)} className="p-3 border-2 rounded-xl text-left font-medium hover:border-brand-teal hover:bg-teal-50">
                                                    <b>{String.fromCharCode(65 + oIdx)}.</b> {opt}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}
                            {isMyTurn && roomData.turnState === 'rolling' && (
                                <Button onClick={rollDice} className="py-4 text-xl animate-bounce">🎲 KOCOK DADU!</Button>
                            )}
                        </div>
                    </div>
                );
            };

            const ResultScreen = () => {
                if (!roomData) return null;
                const sorted = [...roomData.players].sort((a,b) => b.score - a.score || b.position - a.position);
                return (
                    <div className="min-h-screen bg-brand-navy text-white p-8 flex flex-col items-center justify-center">
                        <h1 className="text-5xl font-display font-bold text-brand-gold mb-8">PERMAINAN SELESAI! 🏆</h1>
                        <div className="w-full max-w-2xl bg-slate-800 rounded-2xl p-6 space-y-4">
                            <h3 className="text-xl font-bold border-b border-slate-700 pb-2">Klasemen Akhir</h3>
                            {sorted.map((p, i) => (
                                <div key={p.id} className="flex justify-between items-center p-3 border-b border-slate-700">
                                    <div className="flex items-center gap-3">
                                        <span className="font-bold w-6">#{i+1}</span>
                                        <span className="font-bold">{p.name}</span>
                                    </div>
                                    <div className="font-bold text-brand-gold">{p.score} Poin (Pos: {p.position})</div>
                                </div>
                            ))}
                            <div className="text-center pt-4">
                                <Button onClick={() => setCurrentView('landing')} variant="outline" className="border-white text-white">Kembali ke Beranda</Button>
                            </div>
                        </div>
                    </div>
                );
            };

            if (loading) return <div className="min-h-screen flex items-center justify-center font-bold text-xl">Memuat Sistem...</div>;

            return (
                <div>
                    {toast && (
                        <div className={`fixed top-4 right-4 z-[200] px-6 py-3 rounded-xl text-white font-bold shadow-lg ${toast.type === 'error' ? 'bg-red-500' : 'bg-green-500'}`}>
                            {toast.msg}
                        </div>
                    )}
                    {currentView === 'landing' && <LandingScreen />}
                    {currentView === 'teacher_dash' && <TeacherDashboard />}
                    {currentView === 'admin_dash' && <AdminDashboard />}
                    {currentView === 'question_bank' && <QuestionBankView />}
                    {currentView === 'analytics' && <AnalyticsView />}
                    {currentView === 'join_room' && <StudentJoin />}
                    {currentView === 'lobby' && <Lobby />}
                    {currentView === 'playing' && <GamePlay />}
                    {currentView === 'finished' && <ResultScreen />}

                    {roomData && roomData.status === 'playing' && currentView !== 'playing' && (() => { setCurrentView('playing'); return null; })()}
                    {roomData && roomData.status === 'finished' && currentView !== 'finished' && (() => { setCurrentView('finished'); return null; })()}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<ReactApp />);
    </script>
</body>
</html>
