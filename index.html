    <style>
        body { background-color: #f8fafc; overflow-x: hidden; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }
        .board-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #fff;
            border: 4px solid #0F172A;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        .board-cell {
            border: 1px solid rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: rgba(0,0,0,0.3);
            position: relative;
        }
        .cell-odd { background-color: #e0f2fe; }
        .cell-even { background-color: #f0fdf4; }
        
        .player-token {
            position: absolute;
            width: 80%;
            height: 80%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }
        
        .offset-0 { transform: translate(-20%, -20%); z-index: 15; }
        .offset-1 { transform: translate(20%, -20%); z-index: 14; }
        .offset-2 { transform: translate(-20%, 20%); z-index: 13; }
        .offset-3 { transform: translate(20%, 20%); z-index: 12; }
        .offset-more { transform: scale(0.8); z-index: 11; }
        
        .snake-line { stroke: #ef4444; stroke-width: 4; stroke-dasharray: 5,5; fill: none; opacity: 0.7;}
        .ladder-line { stroke: #10b981; stroke-width: 6; opacity: 0.7; }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>

        const firebaseConfig = {

            { id: 'a30', name: 'Music Talent', icon: '🎸', bg: 'bg-fuchsia-500', isBoy: false },
            { id: 'a31', name: 'Cyber Cadet', icon: '🕶️', bg: 'bg-cyan-700', isBoy: true },
            { id: 'a32', name: 'Future Leader', icon: '👑', bg: 'bg-amber-500', isBoy: false },
        ];

        const SAMPLE_QUESTIONS = [
            { q: "Apa ibukota Indonesia?", options: ["Jakarta", "Bandung", "Surabaya", "Medan"], answer: 0, level: "Mudah", subject: "IPS" },
            { q: "Berapa hasil dari 5 x 6?", options: ["25", "30", "35", "40"], answer: 1, level: "Mudah", subject: "Matematika" },
            { q: "Siapa penemu lampu pijar?", options: ["Albert Einstein", "Nikola Tesla", "Thomas Edison", "Isaac Newton"], answer: 2, level: "Sedang", subject: "IPA" },
            { q: "Apa nama perangkat keras penyimpan data sementara?", options: ["Hardisk", "RAM", "ROM", "Flashdisk"], answer: 1, level: "Sedang", subject: "Informatika" },
            { q: "Rukun Islam yang ketiga adalah?", options: ["Syahadat", "Shalat", "Zakat", "Puasa"], answer: 2, level: "Mudah", subject: "Agama" }
        ];

        const generateGameQuestions = (customQuestions = []) => {
            let base = customQuestions.length > 0 ? customQuestions : SAMPLE_QUESTIONS;
            let pool = [];
            while (pool.length < 50) {
                const shuffled = [...base].sort(() => 0.5 - Math.random());
                pool.push(...shuffled);
            }
            return pool.slice(0, 50);
        };

        // Exact classic board snake and ladder configuration matching the reference image layout
        const EXACT_CLASSIC_BOARD = {
            snakes: { 
                99: 79, 
                93: 88, 89: 72, 74: 55, 62: 41, 
                54: 35, 32: 11
            },
            ladders: { 
                3: 18, 9: 29, 21: 40, 26: 76, 52: 68, 
                56: 95, 80: 99, 91: 99 // exact ladder base-tops
            }
        };

        window.ReactApp = function() {
            const { useState, useEffect, useRef, useMemo } = React;

            const [user, setUser] = useState(null);
            const [userRole, setUserRole] = useState(null); 
            const [currentView, setCurrentView] = useState('landing'); 
            
            const [roomData, setRoomData] = useState(null);
            const [roomId, setRoomId] = useState(null);
            const [playerData, setPlayerData] = useState(null); 
            
            const [toast, setToast] = useState(null);
            const [loading, setLoading] = useState(true);

            // Password Protection Modals
            const [adminModalOpen, setAdminModalOpen] = useState(false);
            const [adminPass, setAdminPass] = useState('');
            const [teacherModalOpen, setTeacherModalOpen] = useState(false);
            const [teacherPass, setTeacherPass] = useState('');

            // Admin & Teacher Data State
            const [teachersList, setTeachersList] = useState([
                { id: 't1', name: 'Bpk. Ahmad, S.Kom', subject: 'Informatika', pass: 'guru123' },
                { id: 't2', name: 'Ibu Siti, M.Pd', subject: 'Matematika', pass: 'guru123' },
                { id: 't3', name: 'Bpk. Rahmat, S.Pd.I', subject: 'Al-Qur\'an Hadis', pass: 'guru123' }
            ]);
            const [newTeacherName, setNewTeacherName] = useState('');
            const [newTeacherSubject, setNewTeacherSubject] = useState('Informatika');
            const [newTeacherPass, setNewTeacherPass] = useState('guru123');

            // Reports & Game History State
            const [gameReports, setGameReports] = useState([
                { id: 'rep-1', room: 'MT14-G7X2', subject: 'Informatika', date: '2026-06-06', playersCount: 24, topPlayer: 'Ahmad', avgAccuracy: '85%' },
                { id: 'rep-2', room: 'MT14-M4TH', subject: 'Matematika', date: '2026-06-05', playersCount: 28, topPlayer: 'Siti', avgAccuracy: '78%' }
            ]);

            // AI Generator State & Gemini Integration
            const [aiModalOpen, setAiModalOpen] = useState(false);
            const [aiSubject, setAiSubject] = useState('Informatika');
            const [aiClass, setAiClass] = useState('Kelas 8');
            const [aiMaterial, setAiMaterial] = useState('Analisis Data');
            const [aiCount, setAiCount] = useState(20);
            const [aiDifficulty, setAiDifficulty] = useState('Sedang');
            const [aiLoading, setAiLoading] = useState(false);
            const [generatedQuestions, setGeneratedQuestions] = useState([]);

            const generateQuestionsWithGeminiAI = async () => {
                setAiLoading(true);
                try {
                    const systemPrompt = "Anda adalah seorang guru ahli pembuat soal kurikulum madrasah / nasional di Indonesia. Buatlah soal pilihan ganda berkualitas tinggi (4 opsi: A, B, C, D) dengan posisi jawaban benar diacak secara merata (bisa di indeks 0, 1, 2, atau 3). Output HANYA dalam format JSON array yang valid tanpa teks lain.";
                    const userQuery = `Buatkan ${aiCount} soal pilihan ganda untuk Mata Pelajaran ${aiSubject}, ${aiClass}, Materi: "${aiMaterial}", Tingkat Kesulitan: ${aiDifficulty}. 
                    Format JSON wajib seperti ini:
                    [
                      {
                        "q": "Pertanyaan...",
                        "options": ["Opsi 1", "Opsi 2", "Opsi 3", "Opsi 4"],
                        "answer": 0,
                        "level": "${aiDifficulty}",
                        "subject": "${aiSubject}"
                      }
                    ]`;

                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=`;
                    const payload = {
                        contents: [{ parts: [{ text: userQuery }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: { responseMimeType: "application/json" }
                    };

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const result = await response.json();
                    const candidate = result.candidates?.[0];
                    if (candidate && candidate.content?.parts?.[0]?.text) {
                        const text = candidate.content.parts[0].text;
                        const parsed = JSON.parse(text);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            setGeneratedQuestions(parsed);
                            showToast(`Berhasil generate ${parsed.length} soal akurat dengan Gemini AI!`, "success");
                        } else {
                            throw new Error("Format JSON dari AI tidak valid");
                        }
                    } else {
                        throw new Error("Gagal menerima respons dari Gemini AI");
                    }
                } catch (err) {
                    console.error("Gemini AI Error:", err);
                    showToast("Gagal terhubung ke Gemini AI. Menggunakan soal cadangan.", "error");
                    const fallback = [];
                    for(let i=1; i<=aiCount; i++) {
                        const randAns = Math.floor(Math.random() * 4);
                        let opts = [`Pilihan A soal ${i}`, `Pilihan B soal ${i}`, `Pilihan C soal ${i}`, `Pilihan D soal ${i}`];
                        fallback.push({
                            q: `[AI ${aiSubject}] Pertanyaan ${i} mengenai ${aiMaterial} (${aiDifficulty})?`,
                            options: opts,
                            answer: randAns,
                            level: aiDifficulty,
                            subject: aiSubject
                        });
                    }
                    setGeneratedQuestions(fallback);
                } finally {
                    setAiLoading(false);
                }
            };

            const playSound = (type) => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    
                    if(type === 'dice') { osc.frequency.value = 400; osc.type = 'sine'; gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1); osc.start(); osc.stop(ctx.currentTime + 0.1); }
                    if(type === 'correct') { osc.frequency.value = 800; osc.type = 'triangle'; gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5); osc.start(); osc.stop(ctx.currentTime + 0.5); }
                    if(type === 'wrong') { osc.frequency.value = 200; osc.type = 'sawtooth'; gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5); osc.start(); osc.stop(ctx.currentTime + 0.5); }
                } catch(e) { console.log('Audio not supported or interaction needed'); }
            };

            const showToast = (msg, type = 'info') => {
                setToast({msg, type});
                setTimeout(() => setToast(null), 3000);
            };

            useEffect(() => {
                if(!auth) {
                    setLoading(false);
                    return;
                }
                
                const initAuth = async () => {
                    const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                    try {
                        if (token) {
                            try {
                                await signInWithCustomToken(auth, token);
                            } catch (customTokenError) {
                                await signInAnonymously(auth);
                            }
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (error) {
                        setLoading(false);
                    }
                };

                const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                    setUser(currentUser);
                    setLoading(false);
                });

                initAuth();
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user || !roomId || !db) return;

                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                const unsubscribe = onSnapshot(roomRef, (snapshot) => {
                    if (snapshot.exists()) {
                        setRoomData(snapshot.data());
                    } else {
                        showToast("Room tidak ditemukan atau telah ditutup", "error");
                        handleLeaveRoom();
                    }
                });

                return () => unsubscribe();
            }, [user, roomId]);

            const createRoom = async () => {
                if (!user) {
                    showToast("Sistem belum terhubung ke server. Tunggu sebentar.", "error");
                    return;
                }
                
                try {
                    const newRoomId = 'MT14-' + Math.random().toString(36).substring(2, 6).toUpperCase();
                    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', newRoomId);
                    
                    const initialRoomData = {
                        id: newRoomId,
                        status: 'lobby',
                        hostId: user.uid,
                        config: {
                            timer: 30,
                            wrongPenalty: 0,
                            maxPlayers: 32,
                            subject: aiSubject
                        },
                        board: EXACT_CLASSIC_BOARD,
                        questions: generatedQuestions.length > 0 ? generatedQuestions : generateGameQuestions(),
                        players: [],
                        turnIndex: 0,
                        turnState: 'idle',
                        currentDice: null,
                        createdAt: Date.now()
                    };

                    await setDoc(roomRef, initialRoomData);
                    setRoomId(newRoomId);
                    setUserRole('teacher');
                    setCurrentView('lobby');
                } catch (e) {
                    showToast("Gagal membuat room: " + e.message, "error");
                }
            };

            const joinRoom = async (code, playerName, avatarId) => {
                if (!user) {
                    showToast("Sistem belum terhubung ke server. Tunggu sebentar.", "error");
                    return;
                }
                
                let rCode = code.toUpperCase().trim();
                if (!rCode.startsWith('MT14-') && rCode.length >= 4) {
                    rCode = 'MT14-' + rCode;
                }

                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', rCode);
                
                try {
                    const snap = await getDoc(roomRef);
                    if (!snap.exists()) {
                        showToast(`Room ${rCode} tidak ditemukan!`, "error");
                        return;
                    }
                    
                    const rData = snap.data();
                    if (rData.status !== 'lobby') {
                        showToast("Permainan sudah dimulai!", "error");
                        return;
                    }

                    if (rData.players.length >= 32) {
                        showToast("Room sudah penuh (Maks 32)", "error");
                        return;
                    }

                    if (rData.players.some(p => p.avatarId === avatarId)) {
                        showToast("Avatar sudah digunakan pemain lain!", "error");
                        return;
                    }

                    const newPlayer = {
                        id: user.uid,
                        name: playerName,
                        avatarId: avatarId,
                        position: 0, 
                        score: 0,
                        correct: 0,
                        wrong: 0,
                        status: 'online'
                    };

                    const updatedPlayers = [...rData.players, newPlayer];
                    await updateDoc(roomRef, { players: updatedPlayers });
                    
                    setPlayerData(newPlayer);
                    setRoomId(rCode);
                    setUserRole('student');
                    setCurrentView('lobby');

                } catch (e) {
                    showToast("Gagal bergabung ke room", "error");
                }
            };

            const handleLeaveRoom = () => {
                setRoomId(null);
                setRoomData(null);
                setPlayerData(null);
                setCurrentView(userRole === 'teacher' ? 'teacher_dash' : userRole === 'admin' ? 'admin_dash' : 'landing');
            };

            const startGame = async () => {
                if (userRole !== 'teacher' || !roomData) return;
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                const startingPlayers = roomData.players.map(p => ({...p, position: 1}));

                await updateDoc(roomRef, {
                    status: 'playing',
                    players: startingPlayers,
                    turnIndex: 0,
                    turnState: 'idle'
                });
            };

            const submitAnswer = async (answerIndex) => {
                if (userRole !== 'student' || !roomData) return;
                const currentPlayer = roomData.players[roomData.turnIndex];
                if (currentPlayer.id !== user.uid) return;
                
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                const qIndex = (roomData.turnIndex + currentPlayer.correct + currentPlayer.wrong) % roomData.questions.length;
                const q = roomData.questions[qIndex] || roomData.questions[0];
                const isCorrect = answerIndex === q.answer;
                
                let updatedPlayers = [...roomData.players];
                let pIndex = roomData.turnIndex;
                
                if (isCorrect) {
                    playSound('correct');
                    showToast("Jawaban Benar! Silakan kocok dadu.", "success");
                    updatedPlayers[pIndex].score += 100;
                    updatedPlayers[pIndex].correct += 1;
                    
                    await updateDoc(roomRef, {
                        players: updatedPlayers,
                        turnState: 'rolling'
                    });
                } else {
                    playSound('wrong');
                    showToast("Jawaban Salah! Giliran berpindah.", "error");
                    updatedPlayers[pIndex].wrong += 1;
                    
                    let newPos = updatedPlayers[pIndex].position - roomData.config.wrongPenalty;
                    if(newPos < 1) newPos = 1;
                    updatedPlayers[pIndex].position = newPos;

                    const nextTurn = (roomData.turnIndex + 1) % roomData.players.length;
                    await updateDoc(roomRef, {
                        players: updatedPlayers,
                        turnIndex: nextTurn,
                        turnState: 'idle'
                    });
                }
            };

            const rollDice = async () => {
                if (!roomData) return;
                const currentPlayer = roomData.players[roomData.turnIndex];
                if (userRole === 'student' && currentPlayer.id !== user.uid) return;
                
                playSound('dice');
                const diceValue = Math.floor(Math.random() * 6) + 1;
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                
                await updateDoc(roomRef, {
                    currentDice: diceValue,
                    turnState: 'moving'
                });

                setTimeout(async () => {
                    let newPos = currentPlayer.position + diceValue;
                    if (newPos > 100) newPos = 100 - (newPos - 100);
                    
                    let updatedPlayers = [...roomData.players];
                    updatedPlayers[roomData.turnIndex].position = newPos;

                    await updateDoc(roomRef, {
                        players: updatedPlayers,
                        turnState: 'resolving'
                    });

                    setTimeout(async () => {
                        let finalPos = newPos;
                        let hitEvent = false;
                        let scoreModifier = 0;

                        if (roomData.board.snakes[newPos]) {
                            finalPos = roomData.board.snakes[newPos];
                            hitEvent = 'snake';
                            scoreModifier = -30;
                        } else if (roomData.board.ladders[newPos]) {
                            finalPos = roomData.board.ladders[newPos];
                            hitEvent = 'ladder';
                            scoreModifier = 50;
                        }

                        if (hitEvent) {
                            updatedPlayers[roomData.turnIndex].position = finalPos;
                            updatedPlayers[roomData.turnIndex].score += scoreModifier;
                            showToast(hitEvent === 'ladder' ? 'Naik Tangga! +50' : 'Terkena Ular! -30', hitEvent === 'ladder' ? 'success' : 'error');
                            await updateDoc(roomRef, { players: updatedPlayers });
                        }

                        if (finalPos === 100) {
                            updatedPlayers[roomData.turnIndex].score += 500;
                            await updateDoc(roomRef, { 
                                players: updatedPlayers,
                                status: 'finished' 
                            });
                            playSound('correct');
                        } else {
                            const nextTurn = (roomData.turnIndex + 1) % roomData.players.length;
                            await updateDoc(roomRef, {
                                turnIndex: nextTurn,
                                turnState: 'idle'
                            });
                        }
                    }, 1000);

                                    <Button className="flex-1 text-lg" onClick={handleJoinClick}>Masuk Game 🚀</Button>
                                </div>
                            </div>
                        </Card>
                    </div>

            const Lobby = () => {
                if (!roomData) return null;
                
                return (
                    <div className="min-h-screen bg-slate-50 p-6 flex flex-col items-center">

                                <div className="absolute top-0 left-0 w-full h-full bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCI+PGNpcmNsZSBjeD0iMTAiIGN5PSIxMCIgcj0iMSIgZmlsbD0icmdiYSgyNTUsMjU1LDI1NSwwLjEpIj48L2NpcmNsZT48L3N2Zz4=')] opacity-30"></div>
                                <h2 className="text-xl font-medium text-brand-teal mb-2 relative z-10">KODE ROOM</h2>
                                <h1 className="text-7xl font-display font-bold tracking-widest mb-4 relative z-10">{roomData.id}</h1>
                                <p className="text-slate-300 relative z-10">Minta siswa memasukkan kode ini di halaman utama.</p>
                                
                                {userRole === 'teacher' && (

                                        <Button onClick={startGame} disabled={roomData.players.length === 0} className="text-xl px-12 py-4">

                                <h3 className="font-bold text-xl mb-4 flex justify-between items-center">

                                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
                                    {roomData.players.map(p => {
                                        const ava = AVATARS.find(a => a.id === p.avatarId);

                                            <div key={p.id} className="bg-slate-50 border border-slate-100 rounded-xl p-3 text-center flex flex-col items-center animate-fade-in">

                                            Belum ada pemain yang bergabung.
                                        </div>
                                    )}
                                </div>
                            </Card>
                        </div>
                    </div>
                );
            };

            const GameBoard = ({ roomData }) => {
                const cells = useMemo(() => {
                    const grid = [];
                    for (let row = 9; row >= 0; row--) {
                        const isEvenRow = row % 2 === 0;
                        for (let col = 0; col < 10; col++) {
                            const actualCol = isEvenRow ? col : 9 - col;
                            const cellNum = (row * 10) + actualCol + 1;
                            grid.push({ num: cellNum, row, col: actualCol, gridIndex: grid.length });
                        }
                    }
                    return grid;
                }, []);

                const getCellCoords = (cellNum) => {
                    if (cellNum < 1 || cellNum > 100) return {x:0, y:0};
                    const row = Math.floor((cellNum - 1) / 10);
                    const isEvenRow = row % 2 === 0;
                    const col = (cellNum - 1) % 10;
                    const actualCol = isEvenRow ? col : 9 - col;
                    return { row: 9 - row, col: actualCol };
                };

                return (
                    <div className="relative w-full max-w-2xl mx-auto shadow-2xl rounded-xl">
                        <div className="board-grid">
                            {cells.map((c) => (
                                <div key={c.num} className={`board-cell ${(c.row + c.col) % 2 === 0 ? 'cell-even' : 'cell-odd'} relative`}>
                                    <span className="absolute top-1 left-1 text-[10px] sm:text-xs opacity-50 font-bold">{c.num}</span>
                                    {c.num === 1 && <span className="absolute bottom-1 right-1 text-[10px] text-brand-teal font-bold">START</span>}
                                    {c.num === 100 && <span className="absolute top-1 right-1 text-[10px] text-brand-gold font-bold">FINISH</span>}
                                </div>
                            ))}

                            <svg className="absolute top-0 left-0 w-full h-full pointer-events-none" style={{ zIndex: 5 }}>
                                {Object.entries(roomData.board.snakes).map(([start, end]) => {
                                    const sCoord = getCellCoords(parseInt(start));
                                    const eCoord = getCellCoords(end);
                                    return (
                                        <line key={`s-${start}`} 
                                            x1={`${(sCoord.col * 10) + 5}%`} y1={`${(sCoord.row * 10) + 5}%`} 
                                            x2={`${(eCoord.col * 10) + 5}%`} y2={`${(eCoord.row * 10) + 5}%`} 
                                            className="snake-line" 
                                        />
                                    );
                                })}
                                {Object.entries(roomData.board.ladders).map(([start, end]) => {
                                    const sCoord = getCellCoords(parseInt(start));
                                    const eCoord = getCellCoords(end);
                                    return (
                                        <line key={`l-${start}`} 
                                            x1={`${(sCoord.col * 10) + 5}%`} y1={`${(sCoord.row * 10) + 5}%`} 
                                            x2={`${(eCoord.col * 10) + 5}%`} y2={`${(eCoord.row * 10) + 5}%`} 
                                            className="ladder-line" 
                                        />
                                    );
                                })}
                            </svg>

                            {roomData.players.map((p, idx) => {
                                if (p.position === 0) return null;
                                const coord = getCellCoords(p.position);
                                const ava = AVATARS.find(a => a.id === p.avatarId);
                                
                                const playersOnSameCell = roomData.players.filter(op => op.position === p.position);
                                const indexOnCell = playersOnSameCell.findIndex(op => op.id === p.id);
                                
                                let offsetClass = 'offset-0';
                                if (playersOnSameCell.length > 1) {
                                    if(indexOnCell === 0) offsetClass = 'offset-0';
                                    else if(indexOnCell === 1) offsetClass = 'offset-1';
                                    else if(indexOnCell === 2) offsetClass = 'offset-2';
                                    else if(indexOnCell === 3) offsetClass = 'offset-3';
                                    else offsetClass = 'offset-more';
                                }

                                return (
                                    <div 
                                        key={p.id}
                                        className={`player-token ${ava?.bg} ${offsetClass} ring-2 ring-white`}
                                        style={{
                                            left: `${(coord.col * 10) + 1}%`,
                                            top: `${(coord.row * 10) + 1}%`,
                                            width: '8%', height: '8%',
                                            transition: 'all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)'
                                        }}
                                        title={`${p.name} (Skor: ${p.score})`}
                                    >
                                        <span className="text-sm">{ava?.icon}</span>
                                        {roomData.turnIndex === idx && (
                                            <div className="absolute -top-6 bg-brand-gold text-white text-[10px] font-bold px-2 py-1 rounded-full animate-bounce">
                                                Me
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            const GamePlay = () => {
                if (!roomData) return null;

                const activePlayer = roomData.players[roomData.turnIndex];
                const isMyTurn = userRole === 'student' && activePlayer?.id === user.uid;
                const isTeacher = userRole === 'teacher';
                const qIndex = activePlayer ? (roomData.turnIndex + activePlayer.correct + activePlayer.wrong) % roomData.questions.length : 0;
                const currentQuestion = roomData.questions[qIndex] || roomData.questions[0]; 

                return (
                    <div className="min-h-screen bg-slate-100 flex flex-col md:flex-row">
                        <div className="w-full md:w-80 bg-white border-r border-slate-200 flex flex-col h-screen max-h-screen">
                            <div className="p-4 bg-brand-navy text-white">
                                <div className="text-xs text-brand-gold font-bold mb-1">ROOM: {roomData.id}</div>
                                <h2 className="font-display font-bold text-lg leading-tight">Ular Tangga Klasik MTsN 14</h2>
                                <p className="text-xs opacity-75">50 Soal Acak</p>
                            </div>
                            
                            <div className="p-3 bg-slate-50 border-b flex justify-between items-center">
                                <span className="font-bold text-slate-600 text-sm">🏆 KLASEMEN</span>
                                <span className="text-xs bg-white px-2 py-1 rounded shadow-sm">{roomData.players.length} Pemain</span>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto p-2 space-y-2">
                                {[...roomData.players].sort((a,b) => b.position - a.position || b.score - a.score).map((p, index) => {
                                    const ava = AVATARS.find(a => a.id === p.avatarId);
                                    const isCurrent = roomData.turnIndex === roomData.players.findIndex(op => op.id === p.id);
                                    return (
                                        <div key={p.id} className={`flex items-center gap-3 p-2 rounded-lg border ${isCurrent ? 'border-brand-teal bg-teal-50 shadow-md transform scale-105 transition-all' : 'border-slate-100 bg-white'} ${p.id === user?.uid ? 'ring-2 ring-brand-gold' : ''}`}>
                                            <div className="font-bold text-slate-400 w-4 text-center">{index + 1}</div>
                                            <div className={`w-10 h-10 rounded-full flex-shrink-0 ${ava?.bg} flex items-center justify-center text-xl`}>
                                                {ava?.icon}
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <div className="font-bold text-brand-navy truncate text-sm">{p.name} {p.id === user?.uid ? '(Kamu)' : ''}</div>
                                                <div className="text-xs text-slate-500 flex justify-between">
                                                    <span>Pos: <b>{p.position || 1}</b></span>
                                                    <span className="text-brand-gold font-bold">{p.score} pts</span>
                                                </div>
                                            </div>
                                            {isCurrent && <div className="text-xl animate-pulse">🎲</div>}
                                        </div>
                                    )
                                })}
                            </div>
                        </div>

                        <div className="flex-1 p-4 md:p-8 flex flex-col h-screen overflow-y-auto bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-100 via-slate-200 to-slate-300">
                            <div className="bg-white rounded-2xl p-4 shadow-sm mb-6 flex justify-between items-center flex-wrap gap-4">
                                <div className="flex items-center gap-4">
                                    <div className="bg-brand-teal text-white w-12 h-12 rounded-full flex items-center justify-center text-2xl shadow-inner font-bold">
                                        {roomData.turnState === 'rolling' || roomData.turnState === 'moving' ? roomData.currentDice || '?' : '🎯'}
                                    </div>
                                    <div>
                                        <div className="text-sm text-slate-500 font-bold uppercase tracking-wider">Giliran Saat Ini</div>
                                        <div className="text-xl font-display font-bold text-brand-navy flex items-center gap-2">
                                            {activePlayer?.name}
                                            {roomData.turnState === 'idle' && <span className="text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded-full animate-pulse">Menjawab Soal...</span>}
                                            {roomData.turnState === 'rolling' && <span className="text-xs bg-green-100 text-green-800 px-2 py-1 rounded-full">Siap melempar!</span>}
                                        </div>
                                    </div>
                                </div>
                                
                                {isTeacher && (
                                    <div className="flex gap-2">
                                        <Button variant="outline" className="py-2 text-sm" onClick={() => {
                                            const nextTurn = (roomData.turnIndex + 1) % roomData.players.length;
                                            updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId), { turnIndex: nextTurn, turnState: 'idle' });
                                        }}>Lewati Giliran</Button>
                                        <Button variant="danger" className="py-2 text-sm" onClick={() => updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId), { status: 'finished' })}>Selesaikan</Button>
                                    </div>
                                )}
                            </div>

                            <div className="flex-1 flex items-center justify-center mb-6">
                                <GameBoard roomData={roomData} />
                            </div>

                            {isMyTurn && roomData.turnState === 'idle' && (
                                <div className="fixed inset-0 z-50 flex items-center justify-center bg-brand-navy bg-opacity-80 p-4 backdrop-blur-sm">
                                    <div className="bg-white rounded-3xl p-8 max-w-xl w-full shadow-2xl transform transition-all">
                                        <div className="flex justify-between items-center mb-6">
                                            <div className="bg-brand-gold text-white text-sm font-bold px-3 py-1 rounded-full">SOAL EVALUASI (4 OPSI)</div>
                                            <div className="text-brand-navy font-bold flex items-center gap-2">⏱️ {roomData.config.timer}s</div>
                                        </div>
                                        <h3 className="text-2xl font-bold text-brand-navy mb-8 leading-relaxed">
                                            {currentQuestion.q}
                                        </h3>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            {currentQuestion.options.map((opt, idx) => (
                                                <button 
                                                    key={idx}
                                                    onClick={() => submitAnswer(idx)}
                                                    className="p-4 border-2 border-slate-200 rounded-xl text-left font-medium hover:border-brand-teal hover:bg-teal-50 transition-colors text-lg"

                                                    <span className="font-bold mr-2 text-slate-400">{String.fromCharCode(65 + idx)}.</span> {opt}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {(isMyTurn || isTeacher) && roomData.turnState === 'rolling' && (
                                <div className="text-center pb-4">
                                    <Button onClick={rollDice} className="px-12 py-4 text-2xl animate-bounce-short shadow-[0_10px_25px_-5px_rgba(245,158,11,0.5)]">
                                        🎲 KOCOK DADU!
                                    </Button>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            const ResultScreen = () => {
                if(!roomData) return null;
                const sortedPlayers = [...roomData.players].sort((a,b) => b.score - a.score || b.position - a.position);
                const podium = sortedPlayers.slice(0, 3);

                return (
                    <div className="min-h-screen bg-brand-navy text-white p-6 flex flex-col items-center justify-center overflow-y-auto">
                        <div className="text-center mb-12">
                            <h1 className="text-6xl font-display font-bold text-brand-gold mb-4 animate-pulse-fast">PERMAINAN SELESAI!</h1>
                            <p className="text-xl text-slate-300">Hasil Evaluasi Kelas & Klasemen Akhir</p>

                        <div className="flex items-end justify-center gap-4 mb-16 h-64">
                            {podium[1] && (
                                <div className="flex flex-col items-center transform translate-y-8 animate-fade-in" style={{animationDelay: '0.3s'}}>
                                    <div className="text-4xl mb-2">{AVATARS.find(a=>a.id===podium[1].avatarId)?.icon}</div>
                                    <div className="font-bold text-lg mb-1">{podium[1].name}</div>
                                    <div className="w-24 h-32 bg-slate-300 rounded-t-lg flex flex-col items-center justify-start pt-4 text-brand-navy">
                                        <span className="text-3xl font-bold">2</span>
                                        <span className="font-bold mt-2">{podium[1].score} pts</span>
                                    </div>
                                </div>
                            )}
                            {podium[0] && (
                                <div className="flex flex-col items-center z-10 animate-fade-in" style={{animationDelay: '0.6s'}}>
                                    <div className="text-5xl mb-2 animate-bounce">{AVATARS.find(a=>a.id===podium[0].avatarId)?.icon}</div>
                                    <div className="font-bold text-xl text-brand-gold mb-1">{podium[0].name}</div>
                                    <div className="w-28 h-40 bg-brand-gold rounded-t-lg flex flex-col items-center justify-start pt-4 text-white shadow-[0_0_30px_rgba(245,158,11,0.5)]">
                                        <span className="text-4xl font-bold">1</span>
                                        <span className="font-bold mt-2">{podium[0].score} pts</span>
                                    </div>
                                </div>
                            )}
                            {podium[2] && (
                                <div className="flex flex-col items-center transform translate-y-12 animate-fade-in" style={{animationDelay: '0.9s'}}>
                                    <div className="text-3xl mb-2">{AVATARS.find(a=>a.id===podium[2].avatarId)?.icon}</div>
                                    <div className="font-bold mb-1">{podium[2].name}</div>
                                    <div className="w-24 h-24 bg-amber-700 rounded-t-lg flex flex-col items-center justify-start pt-4 text-white">
                                        <span className="text-2xl font-bold">3</span>
                                        <span className="font-bold mt-2">{podium[2].score} pts</span>
                                    </div>
                                </div>
                            )}
                        </div>

                        <div className="w-full max-w-4xl bg-slate-800 rounded-2xl p-6 shadow-2xl">
                            <h3 className="text-2xl font-bold mb-6 border-b border-slate-700 pb-4">Statistik Lengkap</h3>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="text-slate-400 border-b border-slate-700">
                                            <th className="p-3">Peringkat</th>
                                            <th className="p-3">Siswa</th>
                                            <th className="p-3">Posisi Akhir</th>
                                            <th className="p-3 text-center">Benar</th>
                                            <th className="p-3 text-center">Salah</th>
                                            <th className="p-3 text-right">Skor Total</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {sortedPlayers.map((p, i) => (
                                            <tr key={p.id} className="border-b border-slate-700 hover:bg-slate-700 transition-colors">
                                                <td className="p-3 font-bold text-slate-300">#{i + 1}</td>
                                                <td className="p-3 font-bold flex items-center gap-2">
                                                    <span>{AVATARS.find(a=>a.id===p.avatarId)?.icon}</span> {p.name}
                                                </td>
                                                <td className="p-3">Kotak {p.position}</td>
                                                <td className="p-3 text-center text-green-400 font-bold">{p.correct}</td>
                                                <td className="p-3 text-center text-red-400 font-bold">{p.wrong}</td>
                                                <td className="p-3 text-right font-bold text-brand-gold">{p.score}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                            
                            <div className="mt-8 text-center">
                                <Button onClick={handleLeaveRoom} variant="outline" className="border-white text-white hover:bg-white hover:text-brand-navy">Kembali ke Beranda</Button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (loading) {
                return <div className="min-h-screen flex items-center justify-center text-brand-navy font-bold text-2xl">Memuat Sistem...</div>;
            }

            return (
                <div className="font-sans text-slate-800">
                    {toast && (
                        <div className={`fixed top-4 right-4 z-[100] px-6 py-3 rounded-xl shadow-lg text-white font-bold transition-all transform translate-y-0 opacity-100 ${toast.type === 'error' ? 'bg-red-500' : toast.type === 'success' ? 'bg-green-500' : 'bg-brand-navy'}`}>
                            {toast.msg}
                        </div>
                    )}

                    {currentView === 'landing' && <LandingScreen />}
                    {currentView === 'teacher_dash' && <TeacherDashboard />}
                    {currentView === 'admin_dash' && <AdminDashboard />}
                    {currentView === 'join_room' && <StudentJoin />}
                    {currentView === 'lobby' && <Lobby />}
                    {currentView === 'playing' && <GamePlay />}
                    {currentView === 'finished' && <ResultScreen />}
                    
                    {roomData && roomData.status === 'playing' && currentView !== 'playing' && (() => { setCurrentView('playing'); return null; })()}
                    {roomData && roomData.status === 'finished' && currentView !== 'finished' && (() => { setCurrentView('finished'); return null; })()}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ReactApp />);
    </script>

    <style>
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.5s ease-out forwards; }
    </style>
</body>
</html>
