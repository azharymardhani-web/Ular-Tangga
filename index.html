            const boardCells = useMemo(() => {
                const grid = [];
                for (let row = 9; row >= 0; row--) {
                    const isEvenRow = row % 2 === 0;
                    for (let col = 0; col < 10; col++) {
                        const actualCol = isEvenRow ? col : 9 - col;
                        const cellNum = (row * 10) + actualCol + 1;
                        grid.push({ num: cellNum, row, col: actualCol, gridIndex: grid.length });
                    }
                }
                return grid;
            }, []);

            const playSound = (type) => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    
                    if(type === 'dice') { osc.frequency.value = 400; osc.type = 'sine'; gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1); osc.start(); osc.stop(ctx.currentTime + 0.1); }
                    if(type === 'correct') { osc.frequency.value = 800; osc.type = 'triangle'; gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5); osc.start(); osc.stop(ctx.currentTime + 0.5); }
                    if(type === 'wrong') { osc.frequency.value = 200; osc.type = 'sawtooth'; gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5); osc.start(); osc.stop(ctx.currentTime + 0.5); }

            const createRoom = async () => {
                if (!user) return;
                try {
                    const newRoomId = 'MT14-' + Math.random().toString(36).substring(2, 6).toUpperCase();
                    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', newRoomId);

                } catch (e) { showToast("Gagal bergabung: " + e.message, "error"); }

                    try {
                        const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                        const snap = await getDoc(roomRef);
                        if (snap.exists()) {
                            const currentPlayers = { ...(snap.data().players || {}) };
                            delete currentPlayers[user.uid];
                            await updateDoc(roomRef, { players: currentPlayers });
                        }
                    } catch (e) {}
                }
                setRoomId(null);
                setRoomData(null);
                setPlayerData(null);
                setCurrentView(userRole === 'teacher' ? 'teacher_dash' : userRole === 'admin' ? 'admin_dash' : 'landing');
                localStorage.removeItem('mt14_roomId');
                localStorage.removeItem('mt14_role');
            };

            const kickPlayer = async (playerId) => {
                if (userRole !== 'teacher' || !roomId) return;
                try {
                    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                    const snap = await getDoc(roomRef);
                    if (snap.exists()) {
                        const currentPlayers = { ...(snap.data().players || {}) };
                        delete currentPlayers[playerId];
                        await updateDoc(roomRef, { players: currentPlayers });
                        showToast("Siswa dikeluarkan.", "info");
                    }
                } catch (e) {}
            };

            const startGame = async () => {
                if (userRole !== 'teacher' || !roomData) return;
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                const updatedPlayersMap = { ...roomData.players };
                Object.keys(updatedPlayersMap).forEach(uid => {
                    updatedPlayersMap[uid].position = 1;
                    updatedPlayersMap[uid].currentState = 'answering';
                    updatedPlayersMap[uid].currentDice = null;
                });
                await updateDoc(roomRef, { status: 'playing', players: updatedPlayersMap });
            };

            const submitAnswer = async (answerIndex) => {
                if (userRole !== 'student' || !roomData || isProcessing) return;
                const myPlayer = roomData.players[user.uid];
                if (!myPlayer || myPlayer.currentState !== 'answering') return;
                
                setIsProcessing(true);
                try {
                    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                    const snap = await getDoc(roomRef);
                    const freshPlayer = snap.data().players[user.uid];
                    if(!freshPlayer) return;

                    let offset = 0;
                    for(let i=0; i<user.uid.length; i++) offset += user.uid.charCodeAt(i);
                    const qIndex = (freshPlayer.correct + freshPlayer.wrong + offset) % snap.data().questions.length;
                    const q = snap.data().questions[qIndex] || snap.data().questions[0];
                    const isCorrect = answerIndex === q.answer;
                    
                    if (isCorrect) {
                        playSound('correct');
                        showToast("Jawaban Benar! Silakan kocok dadu.", "success");
                        await updateDoc(roomRef, { 
                            [`players.${user.uid}.score`]: freshPlayer.score + 100,
                            [`players.${user.uid}.correct`]: freshPlayer.correct + 1,
                            [`players.${user.uid}.currentState`]: 'rolling'
                        });
                        setIsProcessing(false);
                        setHideQuestion(false);
                    } else {
                        playSound('wrong');
                        showToast("Jawaban Salah!", "error");
                        let newPos = freshPlayer.position - (snap.data().config?.wrongPenalty || 0);
                        if(newPos < 1) newPos = 1;
                        await updateDoc(roomRef, { 
                            [`players.${user.uid}.wrong`]: freshPlayer.wrong + 1,
                            [`players.${user.uid}.position`]: newPos
                        });
                        setTimeout(() => {
                            setIsProcessing(false);
                            setHideQuestion(false);
                        }, 2000);
                    }
                } catch (e) { setIsProcessing(false); }
            };

            const rollDice = async () => {
                if (userRole !== 'student' || !roomData || isProcessing) return;
                const myPlayer = roomData.players[user.uid];
                if (!myPlayer || myPlayer.currentState !== 'rolling') return;
                
                setIsProcessing(true);
                playSound('dice');
                const diceValue = Math.floor(Math.random() * 6) + 1;
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                
                try {
                    await updateDoc(roomRef, { 
                        [`players.${user.uid}.currentDice`]: diceValue,
                        [`players.${user.uid}.currentState`]: 'moving'
                    });

                    setTimeout(async () => {
                        const snap2 = await getDoc(roomRef);
                        const p2 = snap2.data().players[user.uid];
                        let newPos = p2.position + diceValue;
                        if (newPos > 100) newPos = 100 - (newPos - 100);
                        
                        await updateDoc(roomRef, { [`players.${user.uid}.position`]: newPos });

                        setTimeout(async () => {
                            const snap3 = await getDoc(roomRef);
                            const p3 = snap3.data().players[user.uid];
                            let finalPos = p3.position;
                            let hitEvent = false;
                            let scoreModifier = 0;

                            if (snap3.data().board.snakes[finalPos]) {
                                finalPos = snap3.data().board.snakes[finalPos];
                                hitEvent = 'snake';
                                scoreModifier = -30;
                            } else if (snap3.data().board.ladders[finalPos]) {
                                finalPos = snap3.data().board.ladders[finalPos];
                                hitEvent = 'ladder';
                                scoreModifier = 50;
                            }

                            if (hitEvent) showToast(hitEvent === 'ladder' ? 'Naik Tangga! +50' : 'Terkena Ular! -30', hitEvent === 'ladder' ? 'success' : 'error');

                            let finalScore = p3.score + scoreModifier;
                            let nextState = 'answering';

                            if (finalPos === 100) {
                                finalScore += 500;
                                nextState = 'finished';
                                playSound('correct');
                                showToast("SELAMAT KAMU MENCAPAI FINISH!", "success");
                            } else {
                                setHideQuestion(false);
                            }
                            
                            await updateDoc(roomRef, { 
                                [`players.${user.uid}.position`]: finalPos,
                                [`players.${user.uid}.score`]: finalScore,
                                [`players.${user.uid}.currentState`]: nextState
                            });
                            setIsProcessing(false);
                        }, 1000);
                    }, 1500);
                } catch (e) { setIsProcessing(false); }

                                                } catch(e) { showToast("Gagal menambah guru", "error"); }
                                            }}>➕ Tambah</Button>
                                        </div>

                                        <div className="space-y-3 mt-6">
                                            {teachersList.map((t, idx) => (
                                                <div key={t.id} className="p-4 border rounded-xl flex justify-between items-center bg-white shadow-sm">
                                                    <div>
                                                        <div className="font-bold text-brand-navy">{t.name}</div>
                                                        <div className="text-xs text-brand-teal font-bold">{t.subject} • Sandi: {t.pass}</div>
                                                    </div>
                                                    <button onClick={async () => {
                                                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'teachers', t.id));
                                                        showToast("Guru dihapus", "info");
                                                    }} className="px-3 py-1 bg-red-50 text-red-600 rounded text-xs font-bold">Hapus</button>
                                                </div>
                                            ))}
                                        </div>
                                    </Card>
                                )}

                                {activeAdminTab === 'reports' && (
                                    <Card className="space-y-6">
                                        <h2 className="text-xl font-bold text-brand-navy">Kelola Laporan Permainan</h2>
                                        <div className="space-y-3 max-h-[60vh] overflow-y-auto">
                                            {roomHistory.map((r) => (
                                                <div key={r.id} className="p-4 border rounded-xl flex justify-between items-center bg-white shadow-sm">
                                                    <div>
                                                        <div className="font-bold text-brand-navy">Room: {r.id} ({r.status})</div>
                                                        <div className="text-xs text-slate-500">Mapel: {r.config?.subject} | Pemain: {Object.keys(r.players || {}).length}</div>
                                                    </div>
                                                    <button onClick={async () => {
                                                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', r.id));
                                                        showToast("Laporan game dihapus", "info");
                                                    }} className="px-3 py-1.5 bg-red-50 text-red-600 rounded text-xs font-bold">Hapus Laporan</button>
                                                </div>
                                            ))}
                                        </div>
                                    </Card>
                                )}
                            </div>
                        </div>
                    )}

                    {currentView === 'join_room' && (
                        <div className="min-h-screen bg-slate-50 p-6 flex items-center justify-center">
                            <div className="max-w-md w-full bg-white rounded-3xl p-8 shadow-xl border">
                                <div className="flex items-center gap-4 border-b pb-4 mb-6">
                                    <button onClick={() => setCurrentView('landing')} className="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center font-bold">←</button>
                                    <h1 className="text-2xl font-display font-bold text-brand-navy">Masuk Kelas Siswa</h1>
                                </div>
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1 uppercase">Kode Ruang (PIN)</label>
                                        <input type="text" value={joinCode} onChange={e => setJoinCode(e.target.value.toUpperCase())} placeholder="MT14-ABCD" className="w-full p-3 border rounded-xl font-bold text-center uppercase" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1 uppercase">Nama Lengkap</label>
                                        <input type="text" value={joinName} onChange={e => setJoinName(e.target.value)} placeholder="Namamu..." className="w-full p-3 border rounded-xl font-bold" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-2 uppercase">Pilih Avatar</label>
                                        <div className="grid grid-cols-4 gap-2 max-h-40 overflow-y-auto p-1">
                                            {AVATARS.map(av => (
                                                <button key={av.id} onClick={() => setSelectedAvatar(av.id)} className={`aspect-square rounded-xl text-2xl flex items-center justify-center ${selectedAvatar === av.id ? 'ring-4 ring-brand-teal ' + av.bg + ' text-white' : 'bg-slate-100'}`}>{av.icon}</button>
                                            ))}
                                        </div>
                                    </div>
                                    <Button onClick={() => {
                                        if(!joinCode || !joinName || !selectedAvatar) { showToast("Lengkapi data!", "error"); return; }
                                        joinRoom(joinCode, joinName, selectedAvatar);
                                    }} className="w-full py-4 text-lg">Masuk Kelas 🚀</Button>
                                </div>
                            </div>
                        </div>
                    )}

                    {currentView === 'lobby' && roomData && (
                        <div className="min-h-screen bg-slate-50 p-6 flex flex-col items-center justify-center">
                            <div className="max-w-4xl w-full bg-white rounded-3xl p-8 shadow-xl">
                                <h1 className="text-3xl font-display font-bold text-brand-navy mb-4">Lobby Room: {roomData.id}</h1>
                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6 max-h-60 overflow-y-auto">
                                    {Object.values(roomData.players || {}).map(p => {
                                        const av = AVATARS.find(a => a.id === p.avatarId);
                                        return (
                                            <div key={p.id} className="p-3 border rounded-xl flex items-center gap-3">
                                                <div className={`w-10 h-10 rounded-full ${av?.bg} flex items-center justify-center text-xl`}>{av?.icon}</div>
                                                <div className="font-bold text-sm truncate">{p.name}</div>
                                            </div>
                                        );
                                    })}
                                </div>
                                <div className="flex gap-4">
                                    <Button variant="outline" onClick={handleLeaveRoom} className="flex-1">Keluar</Button>
                                    {userRole === 'teacher' && (
                                        <Button onClick={startGame} className="flex-1">Mulai Permainan 🚀</Button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {currentView === 'playing' && roomData && (
                        <div className="min-h-screen bg-slate-100 flex flex-col md:flex-row">
                            <div className="w-full md:w-80 bg-white border-r p-4 flex flex-col h-screen">
                                <h2 className="font-bold text-lg mb-4 text-brand-navy">🏆 Klasemen Live</h2>
                                <div className="flex-1 overflow-y-auto space-y-2">
                                    {Object.values(roomData.players || {}).sort((a,b) => b.position - a.position || b.score - a.score).map((p, idx) => {
                                        const av = AVATARS.find(a => a.id === p.avatarId);
                                        return (
                                            <div key={p.id} className="p-2 border rounded-xl flex items-center gap-3 bg-white">
                                                <span className="font-bold text-slate-400">#{idx+1}</span>
                                                <div className={`w-8 h-8 rounded-full ${av?.bg} flex items-center justify-center text-sm`}>{av?.icon}</div>
                                                <div className="flex-1 min-w-0">
                                                    <div className="font-bold text-xs truncate">{p.name}</div>
                                                    <div className="text-[10px] text-slate-500">Kotak: {p.position || 1} | Skor: {p.score}</div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="flex-1 flex flex-col h-screen overflow-y-auto p-4 items-center">
                                <div className={`relative w-full max-w-2xl shadow-2xl rounded-xl p-3 ${roomData.board?.bgTheme || 'bg-white'}`}>
                                    <div className="board-grid">
                                        {boardCells.map((c) => (
                                            <div key={c.num} className={`board-cell ${roomData.board?.cellColors?.[c.num % 5] || 'bg-rose-200'} relative border border-white/40`}>
                                                <span className="absolute top-1 left-1 text-[10px] font-bold opacity-75">{c.num}</span>
                                            </div>
                                        ))}
                                        {Object.values(roomData.players || {}).map((p) => {
                                            if (p.position === 0) return null;
                                            const row = Math.floor((p.position - 1) / 10);
                                            const col = (p.position - 1) % 10;
                                            const actualCol = row % 2 === 0 ? col : 9 - col;
                                            const av = AVATARS.find(a => a.id === p.avatarId);
                                            return (
                                                <div key={p.id} className={`player-token ${av?.bg} ring-2 ring-white`} style={{ left: `${(actualCol * 10) + 1}%`, top: `${((9 - row) * 10) + 1}%`, width: '8%', height: '8%' }}>
                                                    <span className="text-xs">{av?.icon}</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                {userRole === 'student' && (
                                    <div className="mt-6 w-full max-w-xl bg-white p-6 rounded-3xl shadow-lg text-center">
                                        {roomData.players[user?.uid]?.currentState === 'rolling' && (
                                            <Button onClick={rollDice} disabled={isProcessing} className="w-full py-4 text-xl bg-brand-gold">🎲 KOCOK DADU!</Button>
                                        )}
                                        {roomData.players[user?.uid]?.currentState === 'moving' && (
                                            <div className="font-bold text-slate-500">Memindahkan pion... 🎲 {roomData.players[user?.uid]?.currentDice}</div>
                                        )}
                                    </div>
                                )}
                            </div>

                            {userRole === 'student' && roomData.players[user?.uid]?.currentState === 'answering' && !hideQuestion && (
                                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-70 p-4">
                                    <div className="bg-white rounded-3xl p-8 max-w-xl w-full shadow-2xl">
                                        {(() => {
                                            let offset = 0;
                                            for(let i=0; i<user.uid.length; i++) offset += user.uid.charCodeAt(i);
                                            const mp = roomData.players[user.uid];
                                            const qIdx = (mp.correct + mp.wrong + offset) % roomData.questions.length;
                                            const q = roomData.questions[qIdx] || roomData.questions[0];
                                            return (
                                                <div>
                                                    <h3 className="text-xl font-bold text-brand-navy mb-4">{q.q}</h3>
                                                    <div className="grid grid-cols-1 gap-3">
                                                        {q.options.map((opt, idx) => (
                                                            <button key={idx} disabled={isProcessing} onClick={() => submitAnswer(idx)} className="p-4 border-2 rounded-xl text-left font-medium hover:border-brand-teal hover:bg-teal-50">
                                                                <span className="font-bold mr-2">{String.fromCharCode(65 + idx)}.</span> {opt}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>
                                            );
                                        })()}
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {currentView === 'finished' && (
                        <div className="min-h-screen bg-brand-navy text-white p-6 flex flex-col items-center justify-center">
                            <h1 className="text-4xl font-bold text-brand-gold mb-6">PERMAINAN SELESAI!</h1>
                            <div className="w-full max-w-xl bg-slate-800 p-6 rounded-2xl shadow-xl">
                                {Object.values(roomData?.players || {}).sort((a,b) => b.score - a.score).map((p, i) => (
                                    <div key={p.id} className="flex justify-between items-center py-2 border-b border-slate-700">
                                        <div className="font-bold">#{i+1} {p.name}</div>
                                        <div className="text-brand-gold font-bold">{p.score} pts</div>
                                    </div>
                                ))}
                                <div className="mt-6 text-center">
                                    <Button onClick={handleLeaveRoom} variant="outline" className="border-white text-white">Kembali ke Beranda</Button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ReactApp />);
    </script>
</body>
</html>
