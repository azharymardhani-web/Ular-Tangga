        const Button = ({ children, onClick, variant = 'primary', className = '', disabled=false }) => {

        const Card = ({ children, className = '', onClick }) => (

        function TeacherDashboard({ 
            currentTeacher, 
            masterQuestionBank, 
            setMasterQuestionBank, 
            selectedClass, 
            setSelectedClass, 
            createRoom, 
            setCurrentView, 
            showToast,
            db,
            appId
        }) {
            const { useState } = React;
            const assignedSubject = currentTeacher?.subject || "Informatika";
            
            const [activeTeacherTab, setActiveTeacherTab] = useState('create'); 
            const [bankClassFilter, setBankClassFilter] = useState('Semua Kelas');
            const [searchQuery, setSearchQuery] = useState('');
            
            const [manualQ, setManualQ] = useState('');
            const [manualOptA, setManualOptA] = useState('');
            const [manualOptB, setManualOptB] = useState('');
            const [manualOptC, setManualOptC] = useState('');
            const [manualOptD, setManualOptD] = useState('');
            const [manualAns, setManualAns] = useState(0);
            const [manualLevel, setManualLevel] = useState('Sedang');
            const [manualMaterial, setManualMaterial] = useState('Umum');

            // AI Generator States
            const [aiTopic, setAiTopic] = useState('');
            const [aiCount, setAiCount] = useState(10);
            const [aiLevel, setAiLevel] = useState('Sedang');
            const [isGenerating, setIsGenerating] = useState(false);

            const subjectQuestions = masterQuestionBank.filter(q => q.subject === assignedSubject);

            const downloadCsvTemplate = () => {
                const csvContent = "Pertanyaan,Pilihan A,Pilihan B,Pilihan C,Pilihan D,Kunci Jawaban (0=A, 1=B, 2=C, 3=D)\nApa fungsi utama RAM?,Penyimpanan Permanen,Penyimpanan Sementara,Pemrosesan Grafik,Koneksi Internet,1";
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", "Template_Soal_" + assignedSubject + "_" + selectedClass + ".csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("Template CSV berhasil diunduh!", "success");
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const text = evt.target.result;
                        const lines = text.split('\n');
                        const parsedList = [];
                        for (let i = 1; i < lines.length; i++) {
                            const line = lines[i].trim();
                            if (!line) continue;
                            const row = line.split(',');
                            if (row.length >= 6) {
                                parsedList.push({
                                    subject: assignedSubject,
                                    classLevel: selectedClass,
                                    material: 'Umum',
                                    q: row[0].replace(/^"|"$/g, ''),
                                    options: [
                                        row[1].replace(/^"|"$/g, ''),
                                        row[2].replace(/^"|"$/g, ''),
                                        row[3].replace(/^"|"$/g, ''),
                                        row[4].replace(/^"|"$/g, '')
                                    ],
                                    answer: parseInt(row[5]) || 0,
                                    level: 'Sedang',
                                    createdAt: Date.now()
                                });
                            }
                        }
                        if (parsedList.length > 0) {
                            const qCol = collection(db, 'artifacts', appId, 'public', 'data', 'questions');
                            for(let item of parsedList) {
                                await addDoc(qCol, item);
                            }
                            showToast(`Berhasil menyimpan ${parsedList.length} soal untuk ${assignedSubject} (${selectedClass}) ke database!`, "success");
                        } else {
                            showToast("Format file tidak valid atau kosong.", "error");
                        }
                    } catch (err) {
                        showToast("Gagal membaca file CSV", "error");
                    }
                };
                reader.readAsText(file);
            };

            const handleAddManualQuestion = async () => {
                if (!manualQ || !manualOptA || !manualOptB || !manualOptC || !manualOptD) {
                    showToast("Harap isi pertanyaan dan semua pilihan opsi (A, B, C, D)!", "error");
                    return;
                }
                const newQ = {
                    subject: assignedSubject,
                    classLevel: selectedClass,
                    material: manualMaterial,
                    level: manualLevel,
                    q: manualQ,
                    options: [manualOptA, manualOptB, manualOptC, manualOptD],
                    answer: Number(manualAns),
                    createdAt: Date.now()
                };
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'questions'), newQ);
                    setManualQ('');
                    setManualOptA('');
                    setManualOptB('');
                    setManualOptC('');
                    setManualOptD('');
                    showToast(`Soal berhasil ditambahkan ke Database Firebase!`, "success");
                } catch(e) {
                    showToast("Gagal menyimpan soal ke database", "error");
                }
            };

            const handleGenerateAIQuestions = async () => {
                if (!aiTopic.trim()) {
                    showToast("Harap masukkan topik/materi pembahasan terlebih dahulu!", "error");
                    return;
                }
                setIsGenerating(true);
                showToast(`Menghubungkan ke Gemini AI untuk membuat ${aiCount} soal ${selectedClass}...`, "info");

                const apiKey = "";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                const systemPrompt = `Anda adalah seorang guru ahli pembuat soal ujian madrasah tsanawiyah (MTs) di Indonesia. Berdasarkan standar kompetensi Kurikulum Merdeka (KBC), buatlah tepat ${aiCount} buah soal Pilihan Ganda (PG) 4 opsi (A, B, C, D) berkualitas tinggi mata pelajaran ${assignedSubject} untuk tingkat ${selectedClass} dengan topik: "${aiTopic}". Tingkat kesulitan: ${aiLevel}.`;
                
                const userQuery = `Berikan response dalam format JSON murni berupa array of objects tanpa markdown tambahan, dengan struktur:
                [
                  {
                    "q": "Pertanyaan soal...",
                    "options": ["Opsi A", "Opsi B", "Opsi C", "Opsi D"],
                    "answer": 0
                  }
                ]
                Di mana "answer" adalah indeks jawaban benar dari 0 sampai 3 (0 untuk A, 1 untuk B, 2 untuk C, 3 untuk D). Jangan sertakan dummy atau fallback; buatlah murni dari materi yang diminta.`;

                const payload = {
                    contents: [{ parts: [{ text: userQuery }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    generationConfig: { responseMimeType: "application/json" }
                };

                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();
                    const candidate = result.candidates?.[0];
                    if (candidate && candidate.content?.parts?.[0]?.text) {
                        const rawJson = candidate.content.parts[0].text;
                        const parsed = JSON.parse(rawJson);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            const generatedQuestions = parsed.map((item) => ({
                                subject: assignedSubject,
                                classLevel: selectedClass,
                                material: aiTopic,
                                level: aiLevel,
                                q: item.q || "Pertanyaan AI",
                                options: item.options || ["A", "B", "C", "D"],
                                answer: Number(item.answer) >= 0 && Number(item.answer) <= 3 ? Number(item.answer) : 0,
                                createdAt: Date.now()
                            }));

                            const qCol = collection(db, 'artifacts', appId, 'public', 'data', 'questions');
                            for(let item of generatedQuestions) {
                                await addDoc(qCol, item);
                            }
                            
                            setIsGenerating(false);
                            setAiTopic('');
                            showToast(`Berhasil menyimpan ${generatedQuestions.length} soal AI ke Database Firebase!`, "success");
                            setActiveTeacherTab('bank');
                            return;
                        }
                    }
                    throw new Error("Respon AI tidak valid atau kosong.");
                } catch (e) {
                    console.error("AI Generation Error:", e);
                    setIsGenerating(false);
                    showToast("Gagal menghasilkan soal dari AI. Periksa koneksi atau coba beberapa saat lagi.", "error");
                }
            };

            return (
                <div className="min-h-screen bg-slate-50 p-6">
                    <div className="max-w-6xl mx-auto">
                        <div className="flex justify-between items-center mb-6">
                            <div>
                                <h1 className="text-3xl font-display font-bold text-brand-navy">Dashboard Guru: {currentTeacher?.name}</h1>
                                <p className="text-slate-500">Mata Pelajaran: <span className="text-brand-teal font-bold">{assignedSubject}</span></p>
                            </div>
                            <Button variant="outline" onClick={() => setCurrentView('landing')}>Keluar</Button>
                        </div>

                        {/* Navigation Tabs */}
                        <div className="flex gap-2 mb-6 border-b pb-4 overflow-x-auto">
                            <button 
                                onClick={() => setActiveTeacherTab('create')}
                                className={`px-5 py-2.5 rounded-xl font-bold text-sm transition-all whitespace-nowrap ${activeTeacherTab === 'create' ? 'bg-brand-navy text-white shadow-md' : 'bg-white text-slate-600 hover:bg-slate-100'}`}
                            >
                                🎮 Buat & Mulai Game
                            </button>
                            <button 
                                onClick={() => setActiveTeacherTab('bank')}
                                className={`px-5 py-2.5 rounded-xl font-bold text-sm transition-all whitespace-nowrap ${activeTeacherTab === 'bank' ? 'bg-brand-navy text-white shadow-md' : 'bg-white text-slate-600 hover:bg-slate-100'}`}
                            >
                                📚 Kelola Bank Soal ({subjectQuestions.length})
                            </button>
                            <button 
                                onClick={() => setActiveTeacherTab('ai_generator')}
                                className={`px-5 py-2.5 rounded-xl font-bold text-sm transition-all whitespace-nowrap flex items-center gap-2 ${activeTeacherTab === 'ai_generator' ? 'bg-purple-600 text-white shadow-md' : 'bg-purple-50 text-purple-700 hover:bg-purple-100'}`}
                            >
                                ✨ Generate Soal AI
                            </button>
                        </div>

                        {/* TAB 1: CREATE ROOM */}
                        {activeTeacherTab === 'create' && (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <Card className="md:col-span-2 space-y-6">
                                    <h2 className="text-xl font-bold flex items-center gap-2"><span>🚀</span> Mulai Ruang Permainan Baru</h2>
                                    
                                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-4">
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
                                            <div>
                                                <label className="block text-slate-500 mb-1 font-medium">Mata Pelajaran</label>
                                                <input type="text" value={assignedSubject} readOnly className="w-full p-3 border rounded-xl bg-slate-100 text-brand-teal font-bold outline-none cursor-not-allowed" />
                                            </div>
                                            <div>
                                                <label className="block text-slate-500 mb-1 font-medium">Jenjang Kelas Aktif</label>
                                                <select value={selectedClass} onChange={e => setSelectedClass(e.target.value)} className="w-full p-3 border rounded-xl bg-white font-bold text-brand-navy outline-none">
                                                    <option value="Kelas 7 (VII)">Kelas 7 (VII)</option>
                                                    <option value="Kelas 8 (VIII)">Kelas 8 (VIII)</option>
                                                    <option value="Kelas 9 (IX)">Kelas 9 (IX)</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div className="flex items-center justify-between pt-2 text-sm font-bold text-brand-navy">
                                            <span>Soal {selectedClass} tersedia: {subjectQuestions.filter(q => q.classLevel === selectedClass).length} Soal</span>
                                        </div>
                                    </div>
                                    
                                    <Button onClick={createRoom} className="w-full text-lg py-4">Buat Room Sekarang 🚀</Button>
                                </Card>

                                <Card className="space-y-4">

                                    <div className="space-y-3">
                                        <div onClick={() => setActiveTeacherTab('ai_generator')} className="p-4 rounded-xl bg-purple-50 hover:bg-purple-100 text-purple-700 font-medium cursor-pointer transition-colors flex items-center gap-3">
                                            <span className="text-2xl">✨</span>
                                            <div>
                                                <div className="font-bold">Generate Soal AI</div>
                                                <div className="text-xs opacity-75">Buat soal otomatis per jenjang</div>
                                            </div>
                                        </div>
                                        <div onClick={() => setActiveTeacherTab('bank')} className="p-4 rounded-xl bg-blue-50 hover:bg-blue-100 text-blue-700 font-medium cursor-pointer transition-colors flex items-center gap-3">
                                            <span className="text-2xl">📋</span>
                                            <div>
                                                <div className="font-bold">Buka Bank Soal</div>
                                                <div className="text-xs opacity-75">Filter & atur per kelas</div>
                                            </div>
                                        </div>
                                        <div onClick={() => {
                                            const modal = document.getElementById('manual-soal-modal');
                                            if(modal) modal.classList.remove('hidden');
                                        }} className="p-4 rounded-xl bg-teal-50 hover:bg-teal-100 text-teal-700 font-medium cursor-pointer transition-colors flex items-center gap-3">
                                            <span className="text-2xl">➕</span>
                                            <div>
                                                <div className="font-bold">Tambah Soal Baru</div>
                                                <div className="text-xs opacity-75">Input ke {selectedClass}</div>
                                            </div>
                                        </div>
                                    </div>
                                </Card>
                            </div>
                        )}

                        {/* TAB 2: AI GENERATOR */}
                        {activeTeacherTab === 'ai_generator' && (
                            <div className="max-w-2xl mx-auto">
                                <Card className="space-y-6">

            const [selectedClass, setSelectedClass] = useState('Kelas 8 (VIII)');
            const [isProcessing, setIsProcessing] = useState(false);

            // Student Join States
            const [joinCode, setJoinCode] = useState('');
            const [joinName, setJoinName] = useState('');
            const [selectedAvatar, setSelectedAvatar] = useState(null);

            const boardCells = useMemo(() => {
                const grid = [];
                for (let row = 9; row >= 0; row--) {
                    const isEvenRow = row % 2 === 0;
                    for (let col = 0; col < 10; col++) {
                        const actualCol = isEvenRow ? col : 9 - col;
                        const cellNum = (row * 10) + actualCol + 1;
                        grid.push({ num: cellNum, row, col: actualCol, gridIndex: grid.length });
                    }
                }
                return grid;
            }, []);

            const playSound = (type) => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    
                    if(type === 'dice') { osc.frequency.value = 400; osc.type = 'sine'; gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1); osc.start(); osc.stop(ctx.currentTime + 0.1); }
                    if(type === 'correct') { osc.frequency.value = 800; osc.type = 'triangle'; gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5); osc.start(); osc.stop(ctx.currentTime + 0.5); }
                    if(type === 'wrong') { osc.frequency.value = 200; osc.type = 'sawtooth'; gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5); osc.start(); osc.stop(ctx.currentTime + 0.5); }
                } catch(e) { console.log('Audio not supported'); }
            };

            const showToast = (msg, type = 'info') => {
                setToast({msg, type});
                setTimeout(() => setToast(null), 3000);
            };

            useEffect(() => {
                if(!auth) {
                    setLoading(false);
                    return;
                }
                const initAuth = async () => {
                    const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                    try {
                        if (token) {
                            await signInWithCustomToken(auth, token).catch(() => signInAnonymously(auth));
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (error) {
                        await signInAnonymously(auth).catch(err => console.error("Anon auth failed", err));
                        setLoading(false);
                    }
                };
                const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                    setUser(currentUser);
                    setLoading(false);
                });
                initAuth();
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user || !db) return;
                
                // Sync Teachers
                const unsubTeachers = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'teachers'), async (snap) => {
                    const loaded = [];
                    snap.forEach(d => loaded.push({ id: d.id, ...d.data() }));
                    
                    // Cegah auto-respawn jika admin sengaja menghapus semua guru
                    if (loaded.length === 0 && !window.__isTeacherSeeded) {
                        window.__isTeacherSeeded = true;
                        const defaults = [
                            { name: 'Ustadz Ali, S.Pd.I', subject: 'Tahfidz', pass: 'guru123' },
                            { name: 'Ibu Budi, M.Pd', subject: 'PPKn', pass: 'guru123' },
                            { name: 'Bpk. Ahmad, S.Kom', subject: 'Informatika', pass: 'guru123' }

                        const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'teachers');

                        window.__isTeacherSeeded = true;

                // Sync Questions
                const unsubQuestions = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'questions'), async (snap) => {

                    // Cegah auto-respawn jika admin/guru sengaja menghapus semua soal
                    if (loaded.length === 0 && !window.__isQuestionsSeeded) {
                        window.__isQuestionsSeeded = true;
                        const defaultQ = [
                            { subject: 'Informatika', classLevel: 'Kelas 8 (VIII)', material: 'Kurikulum Merdeka', level: 'Sedang', q: 'Apa fungsi utama RAM?', options: ['Penyimpanan Permanen', 'Penyimpanan Sementara', 'Pemrosesan Grafik', 'Koneksi Internet'], answer: 1 },
                            { subject: 'Tahfidz', classLevel: 'Kelas 7 (VII)', material: 'Kurikulum Merdeka', level: 'Mudah', q: 'Surah Al-Fatihah terdiri dari berapa ayat?', options: ['5 Ayat', '6 Ayat', '7 Ayat', '8 Ayat'], answer: 2 },
                            { subject: 'PPKn', classLevel: 'Kelas 9 (IX)', material: 'Kurikulum Merdeka', level: 'Sedang', q: 'Sila ke-3 Pancasila berbunyi?', options: ['Kemanusiaan yang adil dan beradab', 'Persatuan Indonesia', 'Keadilan sosial', 'Ketuhanan Yang Maha Esa'], answer: 1 },
                            { subject: 'SKI', classLevel: 'Kelas 8 (VIII)', material: 'Kurikulum Merdeka', level: 'Sedang', q: 'Siapakah khalifah pertama setelah Rasulullah wafat?', options: ['Umar bin Khattab', 'Usman bin Affan', 'Ali bin Abi Thalib', 'Abu Bakar Ash-Shiddiq'], answer: 3 }
                        ];
                        const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'questions');

                    } else {
                        window.__isQuestionsSeeded = true;

                }, (err) => console.error("Sync questions err:", err));

                return () => { unsubTeachers(); unsubQuestions(); };

            useEffect(() => {
                if (!user || !roomId || !db) return;
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);

            const createRoom = async () => {
                if (!user) {
                    showToast("Sistem belum terhubung ke server.", "error");
                    return;
                }
                try {
                    const newRoomId = 'MT14-' + Math.random().toString(36).substring(2, 6).toUpperCase();
                    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', newRoomId);
                    
                    const teacherSubject = currentTeacher?.subject || 'Informatika';
                    const filteredQuestions = masterQuestionBank.filter(q => q.subject === teacherSubject && q.classLevel === selectedClass);
                    let activeQuestions = filteredQuestions.length > 0 ? filteredQuestions : masterQuestionBank.filter(q => q.subject === teacherSubject);
                    if(activeQuestions.length === 0) activeQuestions = masterQuestionBank;
                    
                    activeQuestions = [...activeQuestions].sort(() => 0.5 - Math.random()).slice(0, 50);

                    const initialRoomData = {
                        id: newRoomId,
                        status: 'lobby',
                        hostId: user.uid,
                        config: { timer: 30, wrongPenalty: 0, maxPlayers: 32, subject: teacherSubject, classLevel: selectedClass },
                        board: BOARD_LAYOUTS.classic,
                        questions: activeQuestions,
                        players: [],
                        createdAt: Date.now()
                    };

                    await setDoc(roomRef, initialRoomData);
                    setRoomId(newRoomId);
                    setUserRole('teacher');
                    setCurrentView('lobby');
                } catch (e) {
                    showToast("Gagal membuat room: " + e.message, "error");
                }
            };

            const joinRoom = async (code, playerName, avatarId) => {
                if (!user) {
                    showToast("Sistem belum terhubung ke server.", "error");
                    return;
                }
                let rCode = code.toUpperCase().trim();
                if (!rCode.startsWith('MT14-') && rCode.length >= 4) {
                    rCode = 'MT14-' + rCode;
                }
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', rCode);
                try {
                    const snap = await getDoc(roomRef);
                    if (!snap.exists()) {
                        showToast(`Room ${rCode} tidak ditemukan!`, "error");
                        return;
                    }
                    const rData = snap.data();
                    if (rData.status !== 'lobby') {
                        showToast("Permainan sudah dimulai!", "error");
                        return;
                    }
                    if (rData.players.length >= 32) {
                        showToast("Room sudah penuh (Maks 32)", "error");
                        return;
                    }
                    if (rData.players.some(p => p.avatarId === avatarId)) {
                        showToast("Avatar sudah dipilih pemain lain!", "error");
                        return;
                    }

                    const newPlayer = {
                        id: user.uid,
                        name: playerName,
                        avatarId: avatarId,
                        position: 0, 
                        score: 0,
                        correct: 0,
                        wrong: 0,
                        currentState: 'answering',
                        currentDice: null,
                        status: 'online'
                    };

                if (userRole !== 'teacher' || !roomData) return;
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                const startingPlayers = roomData.players.map(p => ({
                    ...p, 
                    position: 1,
                    currentState: 'answering', 
                    currentDice: null
                }));
                await updateDoc(roomRef, { status: 'playing', players: startingPlayers });
            };

            const submitAnswer = async (answerIndex) => {
                if (userRole !== 'student' || !roomData || isProcessing) return;
                const myPlayer = roomData.players.find(p => p.id === user.uid);
                if (!myPlayer || myPlayer.currentState !== 'answering') return;
                
                setIsProcessing(true);
                try {
                    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                    const snap = await getDoc(roomRef);
                    let updatedPlayers = [...snap.data().players];
                    const pIndex = updatedPlayers.findIndex(p => p.id === user.uid);
                    
                    const qIndex = (updatedPlayers[pIndex].correct + updatedPlayers[pIndex].wrong) % snap.data().questions.length;
                    const q = snap.data().questions[qIndex] || snap.data().questions[0];
                    const isCorrect = answerIndex === q.answer;
                    
                    if (isCorrect) {
                        playSound('correct');
                        showToast("Jawaban Benar! Silakan kocok dadu.", "success");
                        updatedPlayers[pIndex].score += 100;
                        updatedPlayers[pIndex].correct += 1;
                        updatedPlayers[pIndex].currentState = 'rolling';
                        await updateDoc(roomRef, { players: updatedPlayers });
                        setIsProcessing(false);
                    } else {
                        playSound('wrong');
                        showToast("Jawaban Salah! Coba soal berikutnya...", "error");
                        updatedPlayers[pIndex].wrong += 1;
                        let newPos = updatedPlayers[pIndex].position - snap.data().config.wrongPenalty;
                        if(newPos < 1) newPos = 1;
                        updatedPlayers[pIndex].position = newPos;
                        await updateDoc(roomRef, { players: updatedPlayers });
                        setTimeout(() => setIsProcessing(false), 2000);
                    }
                } catch (e) {
                    setIsProcessing(false);
                }
            };

            const rollDice = async () => {
                if (userRole !== 'student' || !roomData || isProcessing) return;
                const myPlayer = roomData.players.find(p => p.id === user.uid);
                if (!myPlayer || myPlayer.currentState !== 'rolling') return;
                
                setIsProcessing(true);
                playSound('dice');
                const diceValue = Math.floor(Math.random() * 6) + 1;
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                
                try {
                    const snap = await getDoc(roomRef);
                    let updatedPlayers = [...snap.data().players];
                    const pIndex = updatedPlayers.findIndex(p => p.id === user.uid);

                    updatedPlayers[pIndex].currentDice = diceValue;
                    updatedPlayers[pIndex].currentState = 'moving';
                    await updateDoc(roomRef, { players: updatedPlayers });

                    setTimeout(async () => {
                        const snap2 = await getDoc(roomRef);
                        let up2 = [...snap2.data().players];
                        const pIdx2 = up2.findIndex(p => p.id === user.uid);

                        let newPos = up2[pIdx2].position + diceValue;
                        if (newPos > 100) newPos = 100 - (newPos - 100);
                        up2[pIdx2].position = newPos;
                        await updateDoc(roomRef, { players: up2 });

                        setTimeout(async () => {
                            const snap3 = await getDoc(roomRef);
                            let up3 = [...snap3.data().players];
                            const pIdx3 = up3.findIndex(p => p.id === user.uid);

                            let finalPos = up3[pIdx3].position;
                            let hitEvent = false;
                            let scoreModifier = 0;

                            if (snap3.data().board.snakes[finalPos]) {
                                finalPos = snap3.data().board.snakes[finalPos];
                                hitEvent = 'snake';
                                scoreModifier = -30;
                            } else if (snap3.data().board.ladders[finalPos]) {
                                finalPos = snap3.data().board.ladders[finalPos];
                                hitEvent = 'ladder';
                                scoreModifier = 50;
                            }

                            if (hitEvent) {
                                up3[pIdx3].position = finalPos;
                                up3[pIdx3].score += scoreModifier;
                                showToast(hitEvent === 'ladder' ? 'Naik Tangga! +50' : 'Terkena Ular! -30', hitEvent === 'ladder' ? 'success' : 'error');
                            }

                            if (finalPos === 100) {
                                up3[pIdx3].score += 500;
                                up3[pIdx3].currentState = 'finished';
                                playSound('correct');
                                showToast("SELAMAT KAMU MENCAPAI FINISH!", "success");
                            } else {
                                up3[pIdx3].currentState = 'answering';
                            }
                            
                            await updateDoc(roomRef, { players: up3 });
                            setIsProcessing(false);
                        }, 1000);

            const GameBoard = ({ roomData }) => {
                const getCellCoords = (cellNum) => {
                    if (cellNum < 1 || cellNum > 100) return {x:0, y:0};
                    const row = Math.floor((cellNum - 1) / 10);
                    const isEvenRow = row % 2 === 0;
                    const col = (cellNum - 1) % 10;
                    const actualCol = isEvenRow ? col : 9 - col;
                    return { row: 9 - row, col: actualCol };
                };

                return (
                    <div className="relative w-full max-w-2xl mx-auto shadow-2xl rounded-xl">
                        <div className="board-grid">
                            {boardCells.map((c) => (
                                <div key={c.num} className={`board-cell ${(c.row + c.col) % 2 === 0 ? 'cell-even' : 'cell-odd'} relative`}>
                                    <span className="absolute top-1 left-1 text-[10px] sm:text-xs opacity-50 font-bold">{c.num}</span>
                                    {c.num === 1 && <span className="absolute bottom-1 right-1 text-[10px] text-brand-teal font-bold">START</span>}
                                    {c.num === 100 && <span className="absolute top-1 right-1 text-[10px] text-brand-gold font-bold">FINISH</span>}
                                </div>
                            ))}

                            <svg className="absolute top-0 left-0 w-full h-full pointer-events-none" style={{ zIndex: 5 }}>
                                {Object.entries(roomData.board.snakes).map(([start, end]) => {
                                    const sCoord = getCellCoords(parseInt(start));
                                    const eCoord = getCellCoords(end);
                                    return (
                                        <line key={`s-${start}`} 
                                            x1={`${(sCoord.col * 10) + 5}%`} y1={`${(sCoord.row * 10) + 5}%`} 
                                            x2={`${(eCoord.col * 10) + 5}%`} y2={`${(eCoord.row * 10) + 5}%`} 
                                            className="snake-line" 
                                        />
                                    );
                                })}
                                {Object.entries(roomData.board.ladders).map(([start, end]) => {
                                    const sCoord = getCellCoords(parseInt(start));
                                    const eCoord = getCellCoords(end);
                                    return (
                                        <line key={`l-${start}`} 
                                            x1={`${(sCoord.col * 10) + 5}%`} y1={`${(sCoord.row * 10) + 5}%`} 
                                            x2={`${(eCoord.col * 10) + 5}%`} y2={`${(eCoord.row * 10) + 5}%`} 
                                            className="ladder-line" 
                                        />
                                    );
                                })}
                            </svg>

                            {roomData.players.map((p) => {
                                if (p.position === 0) return null;
                                const coord = getCellCoords(p.position);
                                const ava = AVATARS.find(a => a.id === p.avatarId);
                                
                                const playersOnSameCell = roomData.players.filter(op => op.position === p.position);
                                const indexOnCell = playersOnSameCell.findIndex(op => op.id === p.id);
                                let offsetClass = indexOnCell === 0 ? 'offset-0' : indexOnCell === 1 ? 'offset-1' : indexOnCell === 2 ? 'offset-2' : 'offset-3';

                                return (
                                    <div 
                                        key={p.id}
                                        className={`player-token ${ava?.bg} ${offsetClass} ring-2 ring-white`}
                                        style={{
                                            left: `${(coord.col * 10) + 1}%`,
                                            top: `${(coord.row * 10) + 1}%`,
                                            width: '8%', height: '8%',
                                            transition: 'all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)'
                                        }}
                                    >
                                        <span className="text-sm">{ava?.icon}</span>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            const GamePlay = () => {
                if (!roomData) return null;
                const isTeacher = userRole === 'teacher';
                const myPlayer = isTeacher ? null : roomData.players.find(p => p.id === user?.uid);
                const qIndex = myPlayer ? (myPlayer.correct + myPlayer.wrong) % roomData.questions.length : 0;
                const currentQuestion = roomData.questions[qIndex] || roomData.questions[0]; 

                return (
                    <div className="min-h-screen bg-slate-100 flex flex-col md:flex-row">
                        <div className="w-full md:w-80 bg-white border-r border-slate-200 flex flex-col h-screen max-h-screen">
                            <div className="p-4 bg-brand-navy text-white">
                                <div className="text-xs text-brand-gold font-bold mb-1">ROOM: {roomData.id}</div>
                                <h2 className="font-display font-bold text-lg">Ular Tangga Serentak</h2>
                            </div>
                            
                            <div className="p-3 bg-slate-50 border-b flex justify-between items-center">
                                <span className="font-bold text-slate-600 text-sm">🏆 KLASEMEN LIVE</span>
                                <span className="text-xs bg-white px-2 py-1 rounded shadow-sm">{roomData.players.length} Pemain</span>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto p-2 space-y-2">
                                {[...roomData.players].sort((a,b) => b.position - a.position || b.score - a.score).map((p, index) => {
                                    const ava = AVATARS.find(a => a.id === p.avatarId);
                                    const isMe = p.id === user?.uid;
                                    return (
                                        <div key={p.id} className={`flex items-center gap-3 p-2 rounded-lg border ${isMe ? 'border-brand-teal bg-teal-50' : 'border-slate-100 bg-white'}`}>
                                            <div className="font-bold text-slate-400 w-4 text-center">{index + 1}</div>
                                            <div className={`w-10 h-10 rounded-full flex-shrink-0 ${ava?.bg} flex items-center justify-center text-xl`}>{ava?.icon}</div>
                                            <div className="flex-1 min-w-0">
                                                <div className="font-bold text-brand-navy truncate text-sm">{p.name} {isMe ? '(Kamu)' : ''}</div>
                                                <div className="text-xs text-slate-500 flex justify-between">
                                                    <span>Kotak: <b>{p.position || 1}</b></span>
                                                    <span className="text-brand-gold font-bold">{p.score} pts</span>
                                                </div>
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>

                        <div className="flex-1 p-4 md:p-8 flex flex-col h-screen overflow-y-auto">
                            <div className="bg-white rounded-2xl p-4 shadow-sm mb-6 flex justify-between items-center flex-wrap gap-4">
                                <div className="flex items-center gap-4">
                                    <div className="bg-brand-teal text-white w-12 h-12 rounded-full flex items-center justify-center text-xl font-bold">
                                        {isTeacher ? '🚀' : myPlayer?.currentDice || '🎲'}
                                    </div>
                                    <div>
                                        <div className="text-sm text-slate-500 font-bold uppercase">Status Permainan</div>
                                        <div className="text-lg font-bold text-brand-navy">
                                            {isTeacher ? 'Mode Kontrol Guru (Live)' : myPlayer?.currentState === 'answering' ? 'Jawab Soal Pilihan Ganda...' : 'Kocok Dadu!'}
                                        </div>
                                    </div>
                                </div>
                                {isTeacher && (
                                    <Button variant="danger" className="py-2 text-sm" onClick={() => updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId), { status: 'finished' })}>Selesaikan Game</Button>
                                )}
                            </div>

                            <div className="flex-1 flex items-center justify-center mb-6">
                                {GameBoard({ roomData })}
                            </div>

                            {!isTeacher && myPlayer?.currentState === 'answering' && (
                                <div className="fixed inset-0 z-50 flex items-center justify-center bg-brand-navy bg-opacity-80 p-4 backdrop-blur-sm">
                                    <div className="bg-white rounded-3xl p-8 max-w-xl w-full shadow-2xl">
                                        <div className="flex justify-between items-center mb-4">
                                            <span className="bg-brand-gold text-white text-xs font-bold px-3 py-1 rounded-full">SOAL PG MANDIRI #{qIndex + 1}</span>
                                        </div>
                                        <h3 className="text-xl font-bold text-brand-navy mb-6">{currentQuestion.q}</h3>
                                        <div className="grid grid-cols-1 gap-3">
                                            {currentQuestion.options.map((opt, idx) => (
                                                <button 
                                                    key={idx}
                                                    disabled={isProcessing}
                                                    onClick={() => submitAnswer(idx)}
                                                    className="p-4 border-2 rounded-xl text-left font-medium hover:border-brand-teal hover:bg-teal-50 transition-colors"
                                                >
                                                    <span className="font-bold mr-2 text-slate-400">{String.fromCharCode(65 + idx)}.</span> {opt}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {!isTeacher && myPlayer?.currentState === 'rolling' && (
                                <div className="fixed bottom-10 left-0 w-full flex justify-center z-40 pb-4">
                                    <Button onClick={rollDice} disabled={isProcessing} className="px-12 py-5 text-2xl animate-bounce-short shadow-xl border-4 border-white">
                                        🎲 KOCOK DADU!
                                    </Button>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            const ResultScreen = () => {
                if(!roomData) return null;
                const sortedPlayers = [...roomData.players].sort((a,b) => b.score - a.score || b.position - a.position);

                return (
                    <div className="min-h-screen bg-brand-navy text-white p-6 flex flex-col items-center justify-center overflow-y-auto">
                        <h1 className="text-5xl font-display font-bold text-brand-gold mb-2">PERMAINAN SELESAI!</h1>
                        <p className="text-slate-300 mb-8">Klasemen Akhir Kelas</p>

                        <div className="w-full max-w-3xl bg-slate-800 rounded-2xl p-6 shadow-2xl">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="text-slate-400 border-b border-slate-700 text-sm">
                                        <th className="p-3">Rank</th>
                                        <th className="p-3">Siswa</th>
                                        <th className="p-3 text-center">Posisi</th>
                                        <th className="p-3 text-center">Benar</th>
                                        <th className="p-3 text-right">Skor</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {sortedPlayers.map((p, i) => (
                                        <tr key={p.id} className="border-b border-slate-700">
                                            <td className="p-3 font-bold">#{i + 1}</td>
                                            <td className="p-3 font-bold flex items-center gap-2"><span>{AVATARS.find(a=>a.id===p.avatarId)?.icon}</span> {p.name}</td>
                                            <td className="p-3 text-center">Kotak {p.position}</td>
                                            <td className="p-3 text-center text-green-400">{p.correct}</td>
                                            <td className="p-3 text-right font-bold text-brand-gold">{p.score}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                            <div className="mt-6 text-center">
                                <Button onClick={handleLeaveRoom} variant="outline" className="border-white text-white hover:bg-white hover:text-brand-navy">Kembali ke Beranda</Button>
                            </div>
                        </div>
                    </div>
                );
            };

            if (loading) {
                return <div className="min-h-screen flex items-center justify-center text-brand-navy font-bold text-2xl">Memuat Sistem...</div>;
            }

            return (
                <div className="font-sans text-slate-800">
                    {toast && (
                        <div className={`fixed top-4 right-4 z-[100] px-6 py-3 rounded-xl shadow-lg text-white font-bold ${toast.type === 'error' ? 'bg-red-500' : toast.type === 'success' ? 'bg-green-500' : 'bg-brand-navy'}`}>
                            {toast.msg}
                        </div>
                    )}

                    {currentView === 'landing' && LandingScreen()}
                    {currentView === 'teacher_dash' && (
                        <TeacherDashboard 
                            currentTeacher={currentTeacher}
                            masterQuestionBank={masterQuestionBank}
                            setMasterQuestionBank={setMasterQuestionBank}
                            selectedClass={selectedClass}
                            setSelectedClass={setSelectedClass}
                            createRoom={createRoom}
                            setCurrentView={setCurrentView}
                            showToast={showToast}
                            db={db}
                            appId={appId}
                        />
                    )}
                    {currentView === 'admin_dash' && AdminDashboard()}
                    {currentView === 'join_room' && StudentJoin()}
                    {currentView === 'lobby' && Lobby()}
                    {currentView === 'playing' && GamePlay()}
                    {currentView === 'finished' && ResultScreen()}
                    
                    {roomData && roomData.status === 'playing' && currentView !== 'playing' && (() => { setCurrentView('playing'); return null; })()}
                    {roomData && roomData.status === 'finished' && currentView !== 'finished' && (() => { setCurrentView('finished'); return null; })()}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ReactApp />);
    </script>
</body>
</html>
