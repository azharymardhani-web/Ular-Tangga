        .offset-2 { transform: translate(-20%, 20%); z-index: 13; }

        ::-webkit-scrollbar-track { background: #f1f1f1; }

        function GameBoard({ roomData, boardCells }) {
            if (!roomData) return null;
            const getCellCoords = (cellNum) => {
                if (cellNum < 1 || cellNum > 100) return {x:0, y:0};
                const row = Math.floor((cellNum - 1) / 10);
                const isEvenRow = row % 2 === 0;
                const col = (cellNum - 1) % 10;
                const actualCol = isEvenRow ? col : 9 - col;
                return { row: 9 - row, col: actualCol };
            };

            const currentBoardDef = roomData.board || BOARD_LAYOUTS.classic;
            const cellColors = currentBoardDef.cellColors || ['bg-rose-200', 'bg-amber-200', 'bg-emerald-200', 'bg-sky-200', 'bg-violet-200'];
            const roomPlayers = roomData.players || [];

            // Pseudo-random helper to make sure snakes curve exactly the same way on every render
            const pseudoRandom = (seed) => {
                const x = Math.sin(seed) * 10000;
                return x - Math.floor(x);
            };

            return (
                <div className={`relative w-full aspect-square max-w-lg mx-auto shadow-[0_20px_50px_rgba(0,0,0,0.3)] rounded-2xl p-2 ${currentBoardDef.bgTheme || 'bg-white'}`}>
                    <div className="board-grid">
                        {boardCells.map((c) => (
                            <div key={c.num} className={`board-cell ${cellColors[c.num % cellColors.length]}`}>
                                <span className="absolute top-1 left-1 text-[10px] sm:text-xs font-black bg-white/70 text-slate-800 px-1.5 py-0.5 rounded shadow-sm backdrop-blur-md z-0">{c.num}</span>
                            </div>
                        ))}

                        <svg viewBox="0 0 100 100" className="absolute top-0 left-0 w-full h-full pointer-events-none drop-shadow-2xl" style={{ zIndex: 5 }}>
                            <defs>
                                <filter id="board-shadow" x="-20%" y="-20%" width="150%" height="150%">
                                    <feDropShadow dx="1" dy="2" stdDeviation="1.5" floodColor="#000" floodOpacity="0.6" />
                                </filter>
                                <linearGradient id="wood-ladder" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" stopColor="#78350f" />
                                    <stop offset="20%" stopColor="#b45309" />
                                    <stop offset="80%" stopColor="#b45309" />
                                    <stop offset="100%" stopColor="#451a03" />
                                </linearGradient>
                                <linearGradient id="snake-skin" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stopColor="#059669" />
                                    <stop offset="50%" stopColor="#10b981" />
                                    <stop offset="100%" stopColor="#047857" />
                                </linearGradient>
                            </defs>

                            {/* Realistic Ladders */}
                            {Object.entries(currentBoardDef.ladders || {}).map(([start, end]) => {
                                const sCoord = getCellCoords(parseInt(start));
                                const eCoord = getCellCoords(end);
                                const sX = (sCoord.col * 10) + 5; const sY = (sCoord.row * 10) + 5;
                                const eX = (eCoord.col * 10) + 5; const eY = (eCoord.row * 10) + 5;
                                const dx = eX - sX; const dy = eY - sY;
                                const angle = Math.atan2(dy, dx) * (180 / Math.PI);
                                const length = Math.sqrt(dx*dx + dy*dy);
                                const rungsCount = Math.max(3, Math.floor(length / 4));
                                
                                const rungs = [];
                                for (let i = 1; i < rungsCount; i++) {
                                    const pos = (length / rungsCount) * i;
                                    rungs.push(
                                        <rect key={i} x={pos - 0.75} y="-3" width="1.5" height="6" fill="url(#wood-ladder)" rx="0.5" />
                                    );
                                }

                                return (
                                    <g key={`l-${start}`} transform={`translate(${sX} ${sY}) rotate(${angle})`} filter="url(#board-shadow)">
                                        {/* Left Rail */}
                                        <rect x="0" y="-4" width={length} height="2" fill="url(#wood-ladder)" rx="1" />
                                        {/* Right Rail */}
                                        <rect x="0" y="2" width={length} height="2" fill="url(#wood-ladder)" rx="1" />
                                        {/* Rungs */}
                                        {rungs}
                                    </g>
                                );
                            })}

                            {/* Realistic Snakes */}
                            {Object.entries(currentBoardDef.snakes || {}).map(([start, end]) => {
                                const sCoord = getCellCoords(parseInt(start));
                                const eCoord = getCellCoords(end);
                                const sX = (sCoord.col * 10) + 5; const sY = (sCoord.row * 10) + 5; // Head
                                const eX = (eCoord.col * 10) + 5; const eY = (eCoord.row * 10) + 5; // Tail
                                const dx = eX - sX; const dy = eY - sY;
                                
                                // Cubic Bezier curve control points generated deterministically
                                const rand1 = pseudoRandom(parseInt(start) + parseInt(end));
                                const rand2 = pseudoRandom(parseInt(start) * parseInt(end));
                                const ctrl1X = sX + dx * 0.3 + (rand1 > 0.5 ? 8 : -8);
                                const ctrl1Y = sY + dy * 0.3 + (rand1 > 0.5 ? -8 : 8);
                                const ctrl2X = sX + dx * 0.7 + (rand2 > 0.5 ? -8 : 8);
                                const ctrl2Y = sY + dy * 0.7 + (rand2 > 0.5 ? 8 : -8);
                                const path = `M ${sX} ${sY} C ${ctrl1X} ${ctrl1Y}, ${ctrl2X} ${ctrl2Y}, ${eX} ${eY}`;
                                
                                // Calculate angle for snake head to point correctly
                                const headAngle = Math.atan2(ctrl1Y - sY, ctrl1X - sX) * (180 / Math.PI);

                                return (
                                    <g key={`s-${start}`} filter="url(#board-shadow)">
                                        {/* Outer dark border (thickness) */}
                                        <path d={path} fill="none" stroke="#064e3b" strokeWidth="3.5" strokeLinecap="round" />
                                        {/* Inner snake skin */}
                                        <path d={path} fill="none" stroke="url(#snake-skin)" strokeWidth="2.5" strokeLinecap="round" />
                                        {/* Snake Pattern (scales) */}
                                        <path d={path} fill="none" stroke="#6ee7b7" strokeWidth="2.5" strokeDasharray="1, 4" strokeLinecap="round" />
                                        
                                        {/* Tail End */}
                                        <circle cx={eX} cy={eY} r="1" fill="#064e3b" />
                                        
                                        {/* Detailed Snake Head */}
                                        <g transform={`translate(${sX} ${sY}) rotate(${headAngle})`}>
                                            <ellipse cx="0" cy="0" rx="3.5" ry="2.5" fill="#047857" stroke="#064e3b" strokeWidth="0.5" />
                                            {/* Eyes */}
                                            <circle cx="-1" cy="-1.4" r="0.7" fill="#fde047" />
                                            <circle cx="-1" cy="1.4" r="0.7" fill="#fde047" />
                                            <circle cx="-1" cy="-1.4" r="0.3" fill="#000" />
                                            <circle cx="-1" cy="1.4" r="0.3" fill="#000" />
                                            {/* Forked Tongue */}
                                            <path d="M -3.5 0 L -5.5 0 M -5.5 0 L -6.5 -1.2 M -5.5 0 L -6.5 1.2" fill="none" stroke="#ef4444" strokeWidth="0.5" strokeLinecap="round" />
                                        </g>
                                    </g>
                                );
                            })}
                        </svg>

                        {roomPlayers.map((p) => {
                            const pos = Number(p.position || 1);
                            if (pos < 1) return null;
                            const coord = getCellCoords(pos);
                            const ava = AVATARS.find(a => a.id === p.avatarId) || AVATARS[0];
                            const playersOnCell = roomPlayers.filter(op => Number(op.position || 1) === pos);
                            const idxOnCell = playersOnCell.findIndex(op => op.id === p.id);
                            let offsetClass = idxOnCell === 0 ? 'offset-0' : idxOnCell === 1 ? 'offset-1' : idxOnCell === 2 ? 'offset-2' : 'offset-3';

                            return (
                                <div 
                                    key={p.id}
                                    className={`player-token ${ava.bg} ${offsetClass} ring-2 ring-white`}
                                    style={{ left: `${(coord.col * 10) + 1}%`, top: `${(coord.row * 10) + 1}%`, width: '8%', height: '8%' }}
                                >

                                </div>
                            );

        function GamePlay({ roomData, userRole, user, playerData, db, appId, showToast, playSound, boardCells, handleLeaveRoom, kickPlayer, resetPlayerPosition }) {
            const { useState } = React;
            const [teacherPanelOpen, setTeacherPanelOpen] = useState(false);
            const [isProcessing, setIsProcessing] = useState(false);

            if (!roomData) return <div className="min-h-screen flex items-center justify-center font-bold text-brand-navy">Memuat Game...</div>;

            const isTeacher = userRole === 'teacher';
            const roomPlayers = roomData.players || [];
            const activePlayer = isTeacher ? null : (playerData || roomPlayers.find(p => p.id === user?.uid) || { id: user?.uid, position: 1, score: 0, correct: 0, wrong: 0, currentState: 'answering' });
            
            const qList = Array.isArray(roomData.questions) ? roomData.questions : [];
            const attemptCount = activePlayer ? (Number(activePlayer.correct || 0) + Number(activePlayer.wrong || 0)) : 0;
            
            // Fungsi untuk mengacak indeks soal secara unik dan acak per siswa tanpa query database
            const getQuestionIndex = (uid, attempt, max) => {
                if (max <= 0) return 0;
                let h = 0, s = (uid || "guest") + "_" + attempt;
                for (let i = 0; i < s.length; i++) {
                    h = ((h << 5) - h) + s.charCodeAt(i);
                    h |= 0; // Convert to 32bit integer
                }
                return Math.abs(h) % max;
            };
            
            const qIndex = activePlayer ? getQuestionIndex(activePlayer.id, attemptCount, qList.length) : 0;
            const currentQuestion = qList[qIndex] || { q: "Memuat soal latihan...", options: ["A. -", "B. -", "C. -", "D. -"], answer: 0 };
            const qOptions = Array.isArray(currentQuestion.options) ? currentQuestion.options : ["-", "-", "-", "-"];
            
            const isAnswering = activePlayer?.currentState === 'answering';
            const isRollingReady = activePlayer?.currentState === 'rolling';
            const isGamePaused = roomData.config?.isPaused;

            const syncPlayerToDatabase = async (updatedFields) => {
                if (!activePlayer || !db || !user) return;
                try {
                    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomData.id);
                    const snap = await getDoc(roomRef);
                    if (snap.exists()) {
                        const data = snap.data();
                        const players = [...(data.players || [])];
                        const pIndex = players.findIndex(p => p.id === user.uid);
                        if (pIndex !== -1) {
                            players[pIndex] = { ...players[pIndex], ...updatedFields };
                            await updateDoc(roomRef, { players });
                        }
                    }
                } catch (e) {
                    console.error("Sync error", e);
                }
            };

            const submitAnswer = async (answerIndex) => {
                if (userRole !== 'student' || isProcessing || !isAnswering || isGamePaused) return;
                setIsProcessing(true);
                try {
                    const isCorrect = answerIndex === Number(currentQuestion.answer);
                    if (isCorrect) {
                        playSound('correct');
                        showToast("Benar! Tombol kocok dadu aktif.", "success");
                    } else {
                        playSound('wrong');
                        showToast("Kurang tepat! Poin -25.", "error");
                    }

                    const newScore = isCorrect ? Number(activePlayer.score || 0) + 100 : Number(activePlayer.score || 0) - 25;
                    const newCorrect = isCorrect ? Number(activePlayer.correct || 0) + 1 : Number(activePlayer.correct || 0);
                    const newWrong = !isCorrect ? Number(activePlayer.wrong || 0) + 1 : Number(activePlayer.wrong || 0);
                    let newPos = Number(activePlayer.position || 1);
                    if (!isCorrect) {
                        let penalty = Number(roomData.config?.wrongPenalty || 0);
                        newPos = Math.max(1, newPos - penalty);
                    }

                    await syncPlayerToDatabase({
                        score: newScore,
                        correct: newCorrect,
                        wrong: newWrong,
                        position: newPos,
                        currentState: isCorrect ? 'rolling' : 'answering'
                    });
                } finally {
                    setIsProcessing(false);
                }
            };

            const rollDice = async () => {
                if (userRole !== 'student' || isProcessing || !isRollingReady || isGamePaused) return;
                setIsProcessing(true);
                try {
                    playSound('dice');
                    const diceValue = Math.floor(Math.random() * 6) + 1;

                    let newPos = Number(activePlayer.position || 1) + diceValue;
                    if (newPos > 100) newPos = 100 - (newPos - 100);

                    const board = roomData.board || BOARD_LAYOUTS.classic;
                    let hitEvent = false;
                    let scoreMod = 0;

                    if (board.snakes && board.snakes[newPos]) {
                        newPos = board.snakes[newPos];
                        hitEvent = 'snake';
                        scoreMod = -30;
                    } else if (board.ladders && board.ladders[newPos]) {
                        newPos = board.ladders[newPos];
                        hitEvent = 'ladder';
                        scoreMod = 50;
                    }

                    const finalScore = Number(activePlayer.score || 0) + scoreMod + (newPos === 100 ? 500 : 0);
                    const finalState = newPos === 100 ? 'finished' : 'answering';

                    await syncPlayerToDatabase({
                        currentDice: diceValue,
                        position: newPos,
                        score: finalScore,
                        currentState: finalState
                    });

                    if (hitEvent) {
                        showToast(hitEvent === 'ladder' ? 'Naik Tangga! +50' : 'Kena Ular! -30', hitEvent === 'ladder' ? 'success' : 'error');
                    }
                    if (newPos === 100) {
                        playSound('correct');
                        showToast("SELAMAT MENCAPAI FINISH!", "success");
                    }
                } finally {
                    setIsProcessing(false);
                }
            };

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", "Template_Soal_" + assignedSubject + "_" + selectedClass + ".csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("Template CSV berhasil diunduh!", "success");
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const text = evt.target.result;
                        const lines = text.split('\n');
                        const parsedList = [];
                        for (let i = 1; i < lines.length; i++) {
                            const line = lines[i].trim();
                            if (!line) continue;
                            const row = line.split(',');
                            if (row.length >= 6) {
                                parsedList.push({
                                    subject: assignedSubject,
                                    classLevel: selectedClass,
                                    material: 'Umum',
                                    q: row[0].replace(/^"|"$/g, ''),
                                    options: [
                                        row[1].replace(/^"|"$/g, ''),
                                        row[2].replace(/^"|"$/g, ''),
                                        row[3].replace(/^"|"$/g, ''),
                                        row[4].replace(/^"|"$/g, '')
                                    ],
                                    answer: parseInt(row[5]) || 0,
                                    level: 'Sedang',
                                    createdAt: Date.now()
                                });
                            }
                        }
                        if (parsedList.length > 0) {
                            const qCol = collection(db, 'artifacts', appId, 'public', 'data', 'questions');
                            for(let item of parsedList) {
                                await addDoc(qCol, item);
                            }
                            showToast(`Berhasil menyimpan ${parsedList.length} soal untuk ${assignedSubject} (${selectedClass})!`, "success");
                        } else {
                            showToast("Format file tidak valid atau kosong.", "error");
                        }
                    } catch (err) {
                        showToast("Gagal membaca file CSV", "error");
                    }
                };
                reader.readAsText(file);
            };

            const handleAddManualQuestion = async () => {
                if (!manualQ || !manualOptA || !manualOptB || !manualOptC || !manualOptD) {
                    showToast("Harap isi pertanyaan dan semua pilihan opsi!", "error");
                    return;
                }
                const newQ = {
                    subject: assignedSubject,
                    classLevel: selectedClass,
                    material: manualMaterial,
                    level: manualLevel,
                    q: manualQ,
                    options: [manualOptA, manualOptB, manualOptC, manualOptD],
                    answer: Number(manualAns),
                    createdAt: Date.now()
                };
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'questions'), newQ);
                    setManualQ(''); setManualOptA(''); setManualOptB(''); setManualOptC(''); setManualOptD('');
                    showToast(`Soal berhasil ditambahkan!`, "success");

                    showToast("Gagal menyimpan soal", "error");
                }
            };

            const handleGenerateAIQuestions = async () => {
                if (!aiTopic.trim()) {
                    showToast("Harap masukkan topik pembahasan!", "error");
                    return;
                }
                setIsGenerating(true);
                showToast(`Menghubungkan ke Gemini AI untuk membuat ${aiCount} soal...`, "info");

                const apiKey = customApiKey.trim() || "";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                const systemPrompt = `Anda adalah guru pembuat soal MTs. Buat tepat ${aiCount} soal PG 4 opsi mapel ${assignedSubject} untuk tingkat ${selectedClass} dengan topik: "${aiTopic}". Tingkat kesulitan: ${aiLevel}.`;
                const userQuery = `Berikan format JSON murni array of objects: [{"q": "...", "options": ["A","B","C","D"], "answer": 0}] di mana answer index benar 0-3.`;

                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: userQuery }] }], systemInstruction: { parts: [{ text: systemPrompt }] }, generationConfig: { responseMimeType: "application/json" } })
                    });
                    const result = await response.json();
                    const candidate = result.candidates?.[0];
                    if (candidate && candidate.content?.parts?.[0]?.text) {
                        const parsed = JSON.parse(candidate.content.parts[0].text);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            const generatedQuestions = parsed.map((item) => ({
                                subject: assignedSubject,
                                classLevel: selectedClass,
                                material: aiTopic,
                                level: aiLevel,
                                q: item.q,
                                options: item.options,

                                createdAt: Date.now()
                            }));

                            setAiTopic('');

                            return;

                            </Card>
                        </div>
                    </div>
                </div>
            );
        }

        function ResultScreen({ roomData, handleLeaveRoom }) {
            if(!roomData) return null;
            const roomPlayers = roomData.players || [];
            const sortedPlayers = [...roomPlayers].sort((a,b) => Number(b.score || 0) - Number(a.score || 0) || Number(b.position || 1) - Number(a.position || 1));
            return (
                <div className="min-h-screen bg-brand-navy text-white p-6 flex flex-col items-center justify-center overflow-y-auto">
                    <h1 className="text-5xl font-display font-bold text-brand-gold mb-2">PERMAINAN SELESAI!</h1>
                    <p className="text-slate-300 mb-8">Klasemen Akhir</p>
                    <div className="w-full max-w-3xl bg-slate-800 rounded-2xl p-6 shadow-2xl">
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="text-slate-400 border-b border-slate-700 text-sm">
                                    <th className="p-3">Rank</th><th className="p-3">Siswa</th><th className="p-3 text-center">Posisi</th><th className="p-3 text-center">Benar</th><th className="p-3 text-right">Skor</th>
                                </tr>
                            </thead>
                            <tbody>
                                {sortedPlayers.map((p, i) => {
                                    const ava = AVATARS.find(a => a.id === p.avatarId) || AVATARS[0];
                                    return (
                                        <tr key={p.id} className="border-b border-slate-700">
                                            <td className="p-3 font-bold">#{i + 1}</td>
                                            <td className="p-3 font-bold flex items-center gap-2"><span>{ava.icon}</span> {p.name}</td>
                                            <td className="p-3 text-center">Kotak {p.position || 1}</td><td className="p-3 text-center text-green-400">{p.correct || 0}</td><td className="p-3 text-right font-bold text-brand-gold">{p.score || 0}</td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                        <div className="mt-6 text-center">
                            <Button onClick={handleLeaveRoom} variant="outline" className="border-white text-white hover:bg-white hover:text-brand-navy">Kembali</Button>
                        </div>
                    </div>
                </div>
            );
        }

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error("React Error Boundary caught:", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-slate-900 text-white flex flex-col items-center justify-center p-6 text-center">
                            <div className="text-6xl mb-4">⚠️</div>
                            <h1 className="text-2xl font-bold mb-2">Terjadi Kendala Tampilan</h1>
                            <p className="text-slate-400 max-w-md mb-6 text-sm">{this.state.error?.toString() || "Gagal memuat komponen."}</p>
                            <button onClick={() => window.location.reload()} className="px-6 py-3 bg-brand-gold text-white font-bold rounded-xl shadow-lg hover:bg-yellow-500">Muat Ulang Halaman</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        function ReactApp() {
            const { useState, useEffect, useMemo } = React;

            const [user, setUser] = useState(null);
            const [userRole, setUserRole] = useState(null); 
            const [currentView, setCurrentView] = useState('landing'); 
            
            const [roomData, setRoomData] = useState(null);
            const [roomId, setRoomId] = useState(null);
            const [playerData, setPlayerData] = useState(null); 
            
            const [currentTeacher, setCurrentTeacher] = useState(null);
            const [toast, setToast] = useState(null);
            const [loading, setLoading] = useState(true);

            const [adminModalOpen, setAdminModalOpen] = useState(false);
            const [adminUserLogin, setAdminUserLogin] = useState('');
            const [adminPassLogin, setAdminPassLogin] = useState('');
            const [teacherModalOpen, setTeacherModalOpen] = useState(false);
            const [teacherSelectedId, setTeacherSelectedId] = useState('');
            const [teacherPass, setTeacherPass] = useState('');

            const [teachersList, setTeachersList] = useState([]);
            const [myRoomsList, setMyRoomsList] = useState([]);
            const [masterQuestionBank, setMasterQuestionBank] = useState([]);
            const [selectedClass, setSelectedClass] = useState('Kelas 8 (VIII)');
            const [selectedBoardKey, setSelectedBoardKey] = useState('classic');

            const [joinCode, setJoinCode] = useState('');
            const [joinName, setJoinName] = useState('');
            const [selectedAvatar, setSelectedAvatar] = useState(null);

            const boardCells = useMemo(() => {
                const grid = [];
                for (let row = 9; row >= 0; row--) {
                    const isEvenRow = row % 2 === 0;
                    for (let col = 0; col < 10; col++) {
                        const actualCol = isEvenRow ? col : 9 - col;
                        const cellNum = (row * 10) + actualCol + 1;
                        grid.push({ num: cellNum, row, col: actualCol, gridIndex: grid.length });
                    }
                }
                return grid;
            }, []);

            const playSound = (type) => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain); gain.connect(ctx.destination);
                    if(type === 'dice') { osc.frequency.value = 400; osc.type = 'sine'; gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1); osc.start(); osc.stop(ctx.currentTime + 0.1); }
                    if(type === 'correct') { osc.frequency.value = 800; osc.type = 'triangle'; gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4); osc.start(); osc.stop(ctx.currentTime + 0.4); }
                    if(type === 'wrong') { osc.frequency.value = 200; osc.type = 'sawtooth'; gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4); osc.start(); osc.stop(ctx.currentTime + 0.4); }
                } catch(e) {}
            };

            const showToast = (msg, type = 'info') => {
                setToast({msg, type});
                setTimeout(() => setToast(null), 3000);
            };

            useEffect(() => {
                if(!auth) { setLoading(false); return; }
                const initAuth = async () => {
                    const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                    try {
                        if (token) { await signInWithCustomToken(auth, token).catch(() => signInAnonymously(auth)); } 
                        else { await signInAnonymously(auth); }
                    } catch (error) {
                        await signInAnonymously(auth).catch(() => {});
                        setLoading(false);
                    }
                };
                const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                    setUser(currentUser);
                    setLoading(false);
                });
                initAuth();
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                const restoreSession = async () => {
                    if (!user || !db || currentView !== 'landing') return;
                    const savedRoomId = localStorage.getItem('mt14_roomId');
                    const savedRole = localStorage.getItem('mt14_role');
                    if (savedRoomId && savedRole) {
                        try {
                            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', savedRoomId);
                            const snap = await getDoc(roomRef);
                            if (snap.exists()) {
                                const rData = snap.data();
                                if (savedRole === 'teacher' && rData.hostId === user.uid) {
                                    setRoomId(savedRoomId); setUserRole('teacher'); setCurrentView(rData.status);
                                } else if (savedRole === 'student') {
                                    const myPlayer = (rData.players || []).find(p => p.id === user.uid);
                                    if (myPlayer) {
                                        setRoomId(savedRoomId); setUserRole('student'); setPlayerData(myPlayer); setCurrentView(rData.status);
                                    } else {
                                        localStorage.removeItem('mt14_roomId'); localStorage.removeItem('mt14_role');
                                    }
                                }
                            }
                        } catch (e) {}
                    }
                };
                restoreSession();
            }, [user, db, currentView]);

            useEffect(() => {
                if (!user || !db) return;
                const unsubTeachers = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'teachers'), async (snap) => {
                    const loaded = [];
                    snap.forEach(d => loaded.push({ id: d.id, ...d.data() }));
                    if (loaded.length === 0 && !window.__isTeacherSeeded) {
                        window.__isTeacherSeeded = true;
                        const defaults = [
                            { name: 'Ustadz Ali, S.Pd.I', subject: 'Tahfidz', pass: 'guru123' },
                            { name: 'Ibu Budi, M.Pd', subject: 'PPKn', pass: 'guru123' },
                            { name: 'Bpk. Ahmad, S.Kom', subject: 'Informatika', pass: 'guru123' }
                        ];
                        const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'teachers');
                        for (let t of defaults) { await addDoc(colRef, t); }
                    } else {
                        setTeachersList(loaded);
                    }
                });

                const unsubQuestions = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'questions'), async (snap) => {
                    const loaded = [];
                    snap.forEach(d => loaded.push({ id: d.id, ...d.data() }));
                    if (loaded.length === 0 && !window.__isQuestionsSeeded) {
                        window.__isQuestionsSeeded = true;
                        const defaultQ = [
                            { subject: 'Informatika', classLevel: 'Kelas 8 (VIII)', material: 'Umum', level: 'Sedang', q: 'Apa fungsi utama RAM?', options: ['Penyimpanan Permanen', 'Penyimpanan Sementara', 'Pemrosesan Grafik', 'Koneksi Internet'], answer: 1 },
                            { subject: 'Tahfidz', classLevel: 'Kelas 7 (VII)', material: 'Umum', level: 'Mudah', q: 'Surah Al-Fatihah terdiri dari berapa ayat?', options: ['5 Ayat', '6 Ayat', '7 Ayat', '8 Ayat'], answer: 2 },
                        ];
                        const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'questions');
                        for (let q of defaultQ) { await addDoc(colRef, q); }
                    } else {
                        setMasterQuestionBank(loaded);
                    }
                });

                const unsubRooms = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'rooms'), (snap) => {
                    const rList = [];
                    snap.forEach(d => rList.push({ id: d.id, ...d.data() }));
                    if (userRole === 'teacher' && user) {
                        setMyRoomsList(rList.filter(r => r.hostId === user.uid));
                    } else {
                        setMyRoomsList(rList);
                    }
                });

                return () => { unsubTeachers(); unsubQuestions(); unsubRooms(); };
            }, [user, userRole]);

            useEffect(() => {
                if (!user || !roomId || !db) return;
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                const unsubscribe = onSnapshot(roomRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const rData = snapshot.data();
                        setRoomData(rData);
                        
                        if (rData.status === 'playing' && currentView === 'lobby') {
                            setCurrentView('playing');
                        } else if (rData.status === 'finished' && currentView !== 'finished') {
                            setCurrentView('finished');
                        }

                        if (userRole === 'student') {
                            const myP = (rData.players || []).find(p => p.id === user.uid);
                            if (myP) setPlayerData(myP);
                            else {
                                showToast("Anda telah dikeluarkan dari ruangan.", "error");
                                handleLeaveRoom();
                            }
                        }
                    } else {
                        showToast("Room ditutup oleh Guru.", "error");
                        handleLeaveRoom();
                    }
                }, () => {});
                return () => unsubscribe();
            }, [user, roomId, userRole, currentView]);

            const createRoom = async () => {
                if (!user) return;
                try {
                    const newRoomId = 'MT14-' + Math.random().toString(36).substring(2, 6).toUpperCase();
                    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', newRoomId);
                    
                    const teacherSubject = currentTeacher?.subject || 'Informatika';
                    const filteredQuestions = masterQuestionBank.filter(q => q.subject === teacherSubject && q.classLevel === selectedClass);
                    let activeQuestions = filteredQuestions.length > 0 ? filteredQuestions : masterQuestionBank;
                    activeQuestions = [...activeQuestions].sort(() => 0.5 - Math.random()).slice(0, 50);

                    const chosenBoard = BOARD_LAYOUTS[selectedBoardKey] || BOARD_LAYOUTS.classic;

                    await setDoc(roomRef, {
                        id: newRoomId, status: 'lobby', hostId: user.uid,
                        config: { isPaused: false, wrongPenalty: 0, maxPlayers: 32, subject: teacherSubject, classLevel: selectedClass, boardName: chosenBoard.name },
                        board: chosenBoard, questions: activeQuestions, players: [], createdAt: Date.now()
                    });
                    
                    setRoomId(newRoomId); setUserRole('teacher'); setCurrentView('lobby');
                    localStorage.setItem('mt14_roomId', newRoomId); localStorage.setItem('mt14_role', 'teacher');
                } catch (e) { showToast("Gagal membuat room", "error"); }
            };

            const resumeRoom = async (targetRoomId) => {
                try {
                    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', targetRoomId);
                    const snap = await getDoc(roomRef);
                    if (snap.exists()) {
                        setRoomId(targetRoomId); setUserRole('teacher'); setCurrentView(snap.data().status);
                        localStorage.setItem('mt14_roomId', targetRoomId); localStorage.setItem('mt14_role', 'teacher');
                    }
                } catch(e) { showToast("Room tidak ditemukan", "error"); }
            };

            const joinRoom = async (code, playerName, avatarId) => {
                if (!user) return;
                let rCode = code.toUpperCase().trim();
                if (!rCode.startsWith('MT14-') && rCode.length >= 4) rCode = 'MT14-' + rCode;
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', rCode);
                try {
                    const snap = await getDoc(roomRef);
                    if (!snap.exists()) { showToast(`Room ${rCode} tidak ditemukan!`, "error"); return; }
                    const rData = snap.data();
                    if (rData.status !== 'lobby') { showToast("Permainan sudah dimulai!", "error"); return; }
                    if ((rData.players || []).some(p => p.avatarId === avatarId)) { showToast("Avatar sudah dipilih siswa lain!", "error"); return; }

                    const newPlayer = {
                        id: user.uid, name: playerName, avatarId: avatarId,
                        position: 1, score: 0, correct: 0, wrong: 0, currentState: 'answering'
                    };
                    await updateDoc(roomRef, { players: [...(rData.players || []), newPlayer] });

                    setRoomId(rCode); setUserRole('student'); setPlayerData(newPlayer); setCurrentView('lobby');
                    localStorage.setItem('mt14_roomId', rCode); localStorage.setItem('mt14_role', 'student');
                } catch (e) { showToast("Gagal bergabung", "error"); }
            };

            const handleLeaveRoom = async () => {
                if (userRole === 'student' && roomId && user) {
                    try {
                        const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                        const snap = await getDoc(roomRef);
                        if (snap.exists()) {
                            await updateDoc(roomRef, { players: (snap.data().players || []).filter(p => p.id !== user.uid) });
                        }
                    } catch (e) {}
                }
                setRoomId(null); setRoomData(null); setPlayerData(null); 
                setCurrentView(userRole === 'teacher' ? 'teacher_dash' : 'landing');
                localStorage.removeItem('mt14_roomId'); localStorage.removeItem('mt14_role');
            };

            const kickPlayer = async (playerId) => {
                if (userRole !== 'teacher' || !roomId) return;
                try {
                    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                    const snap = await getDoc(roomRef);
                    if (snap.exists()) {
                        await updateDoc(roomRef, { players: (snap.data().players || []).filter(p => p.id !== playerId) });
                    }
                } catch (e) {}
            };

            const resetPlayerPosition = async (playerId) => {
                if (userRole !== 'teacher' || !roomId) return;
                try {
                    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                    const snap = await getDoc(roomRef);
                    if (snap.exists()) {
                        let players = [...(snap.data().players || [])];
                        let pIndex = players.findIndex(p => p.id === playerId);
                        if(pIndex !== -1) {
                            players[pIndex].position = 1;
                            players[pIndex].currentState = 'answering';
                            await updateDoc(roomRef, { players: players });
                            showToast("Posisi siswa direset ke awal", "info");
                        }
                    }
                } catch (e) {}
            };

            const startGame = async () => {
                if (userRole !== 'teacher' || !roomData) return;
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                const startingPlayers = (roomData.players || []).map(p => ({
                    ...p, position: 1, currentState: 'answering', currentDice: null
                }));
                await updateDoc(roomRef, { status: 'playing', players: startingPlayers });
                setCurrentView('playing');
            };

            if (loading) return <div className="min-h-screen flex items-center justify-center text-brand-navy font-bold text-2xl">Memuat Sistem...</div>;

            return (
                <ErrorBoundary>
                    <div className="font-sans text-slate-800">
                        {toast && (
                            <div className={`fixed top-4 right-4 z-[100] px-6 py-3 rounded-xl shadow-lg text-white font-bold ${toast.type === 'error' ? 'bg-red-500' : toast.type === 'success' ? 'bg-green-500' : 'bg-brand-navy'}`}>
                                {toast.msg}
                            </div>
                        )}
                        {currentView === 'landing' && (
                            <LandingScreenUI 
                                setCurrentView={setCurrentView} 
                                setTeacherModalOpen={setTeacherModalOpen} 
                                setAdminModalOpen={setAdminModalOpen} 
                            />
                        )}
                        {currentView === 'teacher_dash' && (
                            <TeacherDashboard 
                                currentTeacher={currentTeacher} 
                                masterQuestionBank={masterQuestionBank} 
                                setMasterQuestionBank={setMasterQuestionBank}
                                selectedClass={selectedClass} 
                                setSelectedClass={setSelectedClass} 
                                createRoom={createRoom} 
                                setCurrentView={setCurrentView} 
                                showToast={showToast} 
                                db={db} 
                                appId={appId} 
                                selectedBoardKey={selectedBoardKey} 
                                setSelectedBoardKey={setSelectedBoardKey} 
                                myRoomsList={myRoomsList} 
                                resumeRoom={resumeRoom} 
                            />
                        )}
                        {currentView === 'admin_dash' && (
                            <AdminDashboard 
                                teachersList={teachersList} 
                                setCurrentView={setCurrentView} 
                                db={db} 
                                appId={appId} 
                                showToast={showToast} 
                            />
                        )}
                        {currentView === 'join_room' && (
                            <StudentJoinUI 
                                joinCode={joinCode} 
                                setJoinCode={setJoinCode} 
                                joinName={joinName} 
                                setJoinName={setJoinName} 
                                selectedAvatar={selectedAvatar} 
                                setSelectedAvatar={setSelectedAvatar} 
                                joinRoom={joinRoom} 
                                setCurrentView={setCurrentView} 
                                db={db} 
                                appId={appId} 
                            />
                        )}
                        {currentView === 'lobby' && (
                            <LobbyUI 
                                roomData={roomData} 
                                userRole={userRole} 
                                kickPlayer={kickPlayer} 
                                startGame={startGame} 
                                handleLeaveRoom={handleLeaveRoom} 
                            />
                        )}
                        {currentView === 'playing' && (
                            <GamePlay 
                                roomData={roomData} 
                                userRole={userRole} 
                                user={user} 
                                playerData={playerData} 
                                db={db} 
                                appId={appId} 
                                showToast={showToast} 
                                playSound={playSound} 
                                boardCells={boardCells} 
                                handleLeaveRoom={handleLeaveRoom} 
                                kickPlayer={kickPlayer} 
                                resetPlayerPosition={resetPlayerPosition} 
                            />
                        )}
                        {currentView === 'finished' && (
                            <ResultScreen 
                                roomData={roomData} 
                                handleLeaveRoom={handleLeaveRoom} 
                            />
                        )}

                        {teacherModalOpen && (
                            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 p-4 backdrop-blur-sm">
                                <div className="bg-white rounded-3xl p-6 md:p-8 max-w-md w-full shadow-2xl">
                                    <h3 className="text-2xl font-bold text-brand-navy mb-2">Autentikasi Guru</h3>
                                    <p className="text-slate-500 text-sm mb-4">Pilih nama Anda dan masukkan password</p>
                                    <select value={teacherSelectedId} onChange={e => setTeacherSelectedId(e.target.value)} className="w-full p-3 border-2 rounded-xl mb-4 font-medium outline-none bg-white">
                                        <option value="">-- Pilih Guru / Mapel --</option>
                                        {teachersList.map(t => <option key={t.id} value={t.id}>{t.name} ({t.subject})</option>)}
                                    </select>
                                    <input type="password" value={teacherPass} onChange={e => setTeacherPass(e.target.value)} placeholder="Password..." className="w-full p-3 border-2 rounded-xl mb-4 font-medium outline-none" autoFocus />
                                    <div className="flex gap-3">
                                        <Button variant="outline" className="flex-1" onClick={() => setTeacherModalOpen(false)}>Batal</Button>
                                        <Button className="flex-1" onClick={() => {
                                            const t = teachersList.find(x => x.id === teacherSelectedId);
                                            if (t && teacherPass === t.pass) {
                                                setCurrentTeacher(t); setUserRole('teacher'); setCurrentView('teacher_dash'); setTeacherModalOpen(false); setTeacherPass('');
                                            } else { showToast("Password salah!", "error"); }
                                        }}>Masuk</Button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {adminModalOpen && (
                            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 p-4 backdrop-blur-sm">
                                <div className="bg-white rounded-3xl p-6 md:p-8 max-w-md w-full shadow-2xl">
                                    <h3 className="text-2xl font-bold text-brand-navy mb-2">Panel Admin</h3>
                                    <input type="text" value={adminUserLogin} onChange={e => setAdminUserLogin(e.target.value)} placeholder="Username..." className="w-full p-3 border-2 rounded-xl mb-3 outline-none" autoFocus />
                                    <input type="password" value={adminPassLogin} onChange={e => setAdminPassLogin(e.target.value)} placeholder="Password..." className="w-full p-3 border-2 rounded-xl mb-4 outline-none" />
                                    <div className="flex gap-3">
                                        <Button variant="outline" className="flex-1" onClick={() => setAdminModalOpen(false)}>Batal</Button>
                                        <Button className="flex-1 bg-purple-600 hover:bg-purple-700" onClick={async () => {
                                            try {
                                                const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'admin_config'));
                                                let u = 'admin'; let p = 'admin123';
                                                if(snap.exists()) { u = snap.data().username || 'admin'; p = snap.data().password || 'admin123'; }
                                                if (adminUserLogin === u && adminPassLogin === p) {
                                                    setUserRole('admin'); setCurrentView('admin_dash'); setAdminModalOpen(false);
                                                } else { showToast("Login gagal", "error"); }
                                            } catch(e) { showToast("Gagal login", "error"); }
                                        }}>Masuk</Button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </ErrorBoundary>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ReactApp />);
    </script>
</body>
</html>
