        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error("ErrorBoundary caught an error", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-50 text-center">

                    );
                }
                return this.props.children;
            }

            const boardCells = useMemo(() => {
                const grid = [];
                for (let row = 9; row >= 0; row--) {
                    const isEvenRow = row % 2 === 0;
                    for (let col = 0; col < 10; col++) {
                        const actualCol = isEvenRow ? col : 9 - col;
                        const cellNum = (row * 10) + actualCol + 1;
                        grid.push({ num: cellNum, row, col: actualCol, gridIndex: grid.length });
                    }
                }
                return grid;
            }, []);

            // Helper Koordinat Untuk SVG Overlay
            const getCellCoords = (cellNum) => {
                if (cellNum < 1 || cellNum > 100) return {row: 9, col: 0};
                const row = Math.floor((cellNum - 1) / 10);
                const isEvenRow = row % 2 === 0;
                const col = (cellNum - 1) % 10;
                const actualCol = isEvenRow ? col : 9 - col;
                return { row: 9 - row, col: actualCol };
            };

            const playSound = (type) => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    
                    if(type === 'dice') { osc.frequency.value = 400; osc.type = 'sine'; gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1); osc.start(); osc.stop(ctx.currentTime + 0.1); }
                    if(type === 'correct') { osc.frequency.value = 800; osc.type = 'triangle'; gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5); osc.start(); osc.stop(ctx.currentTime + 0.5); }
                    if(type === 'wrong') { osc.frequency.value = 200; osc.type = 'sawtooth'; gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5); osc.start(); osc.stop(ctx.currentTime + 0.5); }

                }, (error) => {

                    return;

                    const newRoomId = 'MT14-' + Math.random().toString(36).substring(2, 6).toUpperCase();

                    const teacherSubject = currentTeacher?.subject || 'Informatika';
                    const filteredQuestions = masterQuestionBank.filter(q => q.subject === teacherSubject && q.classLevel === selectedClass);

                        // Fallback dummy question if bank is empty
                        activeQuestions = [{ q: "Belum ada soal untuk mapel ini. Jawab A untuk maju.", options: ["A", "B", "C", "D"], answer: 0 }];

                    const chosenBoard = BOARD_LAYOUTS[selectedBoardKey] || BOARD_LAYOUTS.classic;

                        status: 'lobby',
                        hostId: user.uid,

            const joinRoom = async (code, playerName, avatarId) => {
                if (!user) {
                    showToast("Sistem belum terhubung.", "error");
                    return;
                }
                let rCode = code.toUpperCase().trim();
                if (!rCode.startsWith('MT14-') && rCode.length >= 4) {
                    rCode = 'MT14-' + rCode;
                }
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', rCode);
                try {
                    const snap = await getDoc(roomRef);
                    if (!snap.exists()) {
                        showToast(`Room ${rCode} tidak ditemukan!`, "error");
                        return;
                    }
                    const rData = snap.data();
                    
                    // RECONNECT & DUPLICATE LOGIC
                    const existingPlayerIndex = rData.players.findIndex(p => p.name.trim().toLowerCase() === playerName.trim().toLowerCase());
                    
                    if (existingPlayerIndex !== -1) {
                        // Nama sudah ada. Cek apakah ini sesi yang sama (Reconnect)
                        if (rData.status === 'playing') {

                            const updatedPlayers = [...rData.players];
                            updatedPlayers[existingPlayerIndex].id = user.uid; // bind current session ID

                            setRoomId(rCode);

                            setCurrentView('playing');

                    // Pemain Baru Masuk
                    if (rData.status !== 'lobby') {
                        showToast("Game sudah dimulai! Kamu tidak bisa join sebagai pemain baru.", "error");
                        return;
                    }
                    if (rData.players.length >= 32) {
                        showToast("Room sudah penuh (Maks 32)", "error");
                        return;
                    }

                    // Acak Soal Khusus Siswa Ini
                    const shuffledQuestions = [...rData.questions].sort(() => 0.5 - Math.random());

                    const newPlayer = {
                        id: user.uid,
                        name: playerName.trim(),
                        avatarId: avatarId,
                        position: 0, // 0 means haven't started. Will be 1 when game starts.
                        score: 0,
                        correct: 0,
                        wrong: 0,
                        currentQIndex: 0, // Track index soal secara spesifik
                        currentState: 'waiting',
                        personalQuestions: shuffledQuestions
                    };
                    
                    const updatedPlayers = [...rData.players, newPlayer];
                    await updateDoc(roomRef, { players: updatedPlayers });

                    setRoomId(rCode);
                    setUserRole('student');
                    setCurrentView('lobby');
                    showToast("Berhasil bergabung ke ruangan!", "success");
                } catch (e) {
                    showToast("Terjadi kesalahan: " + e.message, "error");
                }
            };

            const handleLeaveRoom = async () => {
                // Jika student keluar dari LOBBY, hapus namanya. 
                // Jika sedang PLAYING, biarkan saja datanya agar bisa Reconnect nanti.
                if (userRole === 'student' && roomId && user && roomData) {
                    if (roomData.status === 'lobby') {
                        try {
                            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                            const snap = await getDoc(roomRef);
                            if (snap.exists()) {
                                const updatedPlayers = snap.data().players.filter(p => p.id !== user.uid);
                                await updateDoc(roomRef, { players: updatedPlayers });
                            }
                        } catch (e) {
                            console.error("Gagal menghapus data siswa", e);
                        }
                    }
                }
                setRoomId(null);
                setRoomData(null);
                setCurrentView(userRole === 'teacher' ? 'teacher_dash' : userRole === 'admin' ? 'admin_dash' : 'landing');

            const kickPlayer = async (playerId) => {
                if (userRole !== 'teacher' || !roomId) return;
                try {

                    const snap = await getDoc(roomRef);
                    if (snap.exists()) {

                        await updateDoc(roomRef, { players: updatedPlayers });

                } catch (e) {
                    showToast("Gagal mengeluarkan siswa", "error");
                }
            };

            const startGame = async () => {
                if (userRole !== 'teacher' || !roomData) return;
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                
                // Setemua pemain serentak jalan (Simultaneous)
                const startingPlayers = roomData.players.map(p => ({
                    ...p, 
                    position: 1, 
                    currentState: 'answering', 
                    currentQIndex: 0,
                    currentDice: null
                }));
                await updateDoc(roomRef, { status: 'playing', players: startingPlayers });
            };

            const submitAnswer = async (answerIndex) => {
                if (userRole !== 'student' || !roomData || isProcessing) return;
                const myPlayer = roomData.players.find(p => p.id === user.uid);
                if (!myPlayer || myPlayer.currentState !== 'answering') return;
                
                setIsProcessing(true);
                try {
                    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                    const snap = await getDoc(roomRef);
                    let updatedPlayers = [...snap.data().players];
                    const pIndex = updatedPlayers.findIndex(p => p.id === user.uid);
                    if (pIndex === -1) { setIsProcessing(false); return; }
                    
                    const pList = updatedPlayers[pIndex].personalQuestions || snap.data().questions;
                    const qIndex = updatedPlayers[pIndex].currentQIndex || 0;
                    const q = pList[qIndex % pList.length]; 
                    
                    const isCorrect = answerIndex === q.answer;
                    
                    // Lanjut ke soal berikutnya apapun jawabannya
                    updatedPlayers[pIndex].currentQIndex = qIndex + 1;
                    
                    if (isCorrect) {
                        playSound('correct');
                        showToast("Jawaban Benar! Silakan kocok dadu.", "success");
                        updatedPlayers[pIndex].score += 100;
                        updatedPlayers[pIndex].correct += 1;
                        updatedPlayers[pIndex].currentState = 'rolling';
                        await updateDoc(roomRef, { players: updatedPlayers });
                        setIsProcessing(false);
                        setHideQuestion(false);
                    } else {
                        playSound('wrong');
                        showToast("Jawaban Salah! Maju ke soal berikutnya...", "error");
                        updatedPlayers[pIndex].wrong += 1;
                        // Hukuman jika salah (tetap di tempat, tapi soal ganti)
                        await updateDoc(roomRef, { players: updatedPlayers });
                        setTimeout(() => {
                            setIsProcessing(false);
                            setHideQuestion(false);
                        }, 1500);
                    }
                } catch (e) {
                    setIsProcessing(false);
                }
            };

            const rollDice = async () => {
                if (userRole !== 'student' || !roomData || isProcessing) return;
                const myPlayer = roomData.players.find(p => p.id === user.uid);
                if (!myPlayer || myPlayer.currentState !== 'rolling') return;
                
                setIsProcessing(true);
                playSound('dice');
                const diceValue = Math.floor(Math.random() * 6) + 1;
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                
                try {
                    const snap = await getDoc(roomRef);
                    let updatedPlayers = [...snap.data().players];
                    const pIndex = updatedPlayers.findIndex(p => p.id === user.uid);
                    if (pIndex === -1) { setIsProcessing(false); return; }

                    updatedPlayers[pIndex].currentDice = diceValue;
                    updatedPlayers[pIndex].currentState = 'moving';
                    await updateDoc(roomRef, { players: updatedPlayers });

                    setTimeout(async () => {
                        const snap2 = await getDoc(roomRef);
                        let up2 = [...snap2.data().players];
                        const pIdx2 = up2.findIndex(p => p.id === user.uid);
                        if (pIdx2 === -1) { setIsProcessing(false); return; }

                        let newPos = up2[pIdx2].position + diceValue;
                        if (newPos > 100) newPos = 100 - (newPos - 100);
                        up2[pIdx2].position = newPos;
                        await updateDoc(roomRef, { players: up2 });

                        setTimeout(async () => {
                            const snap3 = await getDoc(roomRef);
                            let up3 = [...snap3.data().players];
                            const pIdx3 = up3.findIndex(p => p.id === user.uid);
                            if (pIdx3 === -1) { setIsProcessing(false); return; }

                            let finalPos = up3[pIdx3].position;
                            let hitEvent = false;
                            let scoreModifier = 0;

                            if (snap3.data().board.snakes[finalPos]) {
                                finalPos = snap3.data().board.snakes[finalPos];
                                hitEvent = 'snake';
                                scoreModifier = -30;
                            } else if (snap3.data().board.ladders[finalPos]) {
                                finalPos = snap3.data().board.ladders[finalPos];
                                hitEvent = 'ladder';
                                scoreModifier = 50;
                            }

                            if (hitEvent) {
                                up3[pIdx3].position = finalPos;
                                up3[pIdx3].score += scoreModifier;
                                showToast(hitEvent === 'ladder' ? 'Naik Tangga! +50' : 'Terkena Ular! -30', hitEvent === 'ladder' ? 'success' : 'error');
                            }

                            if (finalPos === 100) {
                                up3[pIdx3].score += 500;
                                up3[pIdx3].currentState = 'finished';
                                playSound('correct');
                                showToast("SELAMAT KAMU MENCAPAI FINISH!", "success");
                            } else {
                                up3[pIdx3].currentState = 'answering';
                                setHideQuestion(false);
                            }
                            
                            await updateDoc(roomRef, { players: up3 });
                            setIsProcessing(false);
                        }, 1000);

                    setIsProcessing(false);
                }

                                            <input value={manualOptA} onChange={e=>setManualOptA(e.target.value)} placeholder="Opsi A" className="w-full p-2 border rounded-xl"/>
                                            <input value={manualOptB} onChange={e=>setManualOptB(e.target.value)} placeholder="Opsi B" className="w-full p-2 border rounded-xl"/>
                                            <input value={manualOptC} onChange={e=>setManualOptC(e.target.value)} placeholder="Opsi C" className="w-full p-2 border rounded-xl"/>
                                            <input value={manualOptD} onChange={e=>setManualOptD(e.target.value)} placeholder="Opsi D" className="w-full p-2 border rounded-xl"/>
                                        </div>
                                        <select value={manualAns} onChange={e=>setManualAns(Number(e.target.value))} className="w-full p-3 border rounded-xl font-bold">
                                            <option value={0}>Kunci A</option><option value={1}>Kunci B</option><option value={2}>Kunci C</option><option value={3}>Kunci D</option>
                                        </select>
                                        <Button onClick={handleAddManualQuestion} className="w-full">Simpan Manual</Button>
                                    </div>
                                </Card>
                            )}

                            {activeTeacherTab === 'bank' && (
                                <Card>
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-xl font-bold">📚 Bank Soal: {assignedSubject}</h2>
                                        <select value={bankClassFilter} onChange={e => setBankClassFilter(e.target.value)} className="p-2 border rounded-xl font-bold text-sm outline-none">
                                            <option value="Semua Kelas">Semua Kelas ({subjectQuestions.length})</option>
                                            <option value="Kelas 7 (VII)">Kelas 7 (VII)</option><option value="Kelas 8 (VIII)">Kelas 8 (VIII)</option><option value="Kelas 9 (IX)">Kelas 9 (IX)</option>
                                        </select>
                                    </div>
                                    <div className="space-y-3 max-h-96 overflow-y-auto">
                                        {subjectQuestions.filter(q => bankClassFilter === 'Semua Kelas' || q.classLevel === bankClassFilter).map((q, idx) => (
                                            <div key={q.id} className="p-3 border rounded-xl flex justify-between items-center text-sm">
                                                <div>
                                                    <span className="font-bold text-brand-teal mr-2">#{idx+1} {q.classLevel}</span>
                                                    <span className="font-semibold">{q.q}</span>
                                                </div>
                                                <button onClick={() => deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'questions', q.id))} className="text-red-500 font-bold ml-4">Hapus</button>
                                            </div>
                                        ))}
                                    </div>
                                </Card>
                            )}
                        </div>
                    </div>
                );
            };

            const StudentJoin = () => (
                <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-4">
                    <Card className="max-w-md w-full">
                        <h1 className="text-3xl font-display font-bold text-brand-navy mb-6 text-center">Masuk Game</h1>
                        <div className="space-y-4">
                            <input type="text" value={joinCode} onChange={e => setJoinCode(e.target.value)} placeholder="KODE ROOM (MT14-XXXX)" className="w-full p-3 border-2 rounded-xl uppercase font-bold text-center" />
                            <input type="text" value={joinName} onChange={e => setJoinName(e.target.value)} placeholder="Nama Lengkapmu..." className="w-full p-3 border-2 rounded-xl text-center font-bold" />
                            <div className="grid grid-cols-4 gap-2 max-h-40 overflow-y-auto p-2 border rounded-xl">
                                {AVATARS.map(av => (
                                    <div key={av.id} onClick={() => setSelectedAvatar(av.id)} className={`p-2 rounded-xl flex items-center justify-center cursor-pointer text-2xl ${selectedAvatar === av.id ? 'bg-brand-gold shadow-md scale-110 ring-2 ring-brand-navy' : 'bg-slate-100 hover:bg-slate-200'}`}>
                                        {av.icon}
                                    </div>
                                ))}
                            </div>
                            <Button onClick={() => joinRoom(joinCode, joinName, selectedAvatar)} className="w-full py-4 text-lg">Gabung Sekarang 🚀</Button>
                            <Button variant="outline" onClick={() => setCurrentView('landing')} className="w-full">Kembali</Button>
                        </div>
                    </Card>
                </div>
            );

            const Lobby = () => {
                if (!roomData) return null;
                const isHost = userRole === 'teacher';
                return (
                    <div className="min-h-screen bg-slate-50 p-6 flex items-center justify-center">
                        <Card className="max-w-4xl w-full">
                            <div className="text-center mb-6 border-b pb-4">
                                <h1 className="text-4xl font-display font-bold text-brand-navy">ROOM: {roomData.id}</h1>
                                <p className="text-brand-gold font-bold text-lg">{roomData.config.subject} - {roomData.config.classLevel}</p>
                            </div>
                            <div className="mb-8">
                                <h3 className="font-bold mb-3 text-slate-600">Siswa Bergabung ({roomData.players.length}/32)</h3>
                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 max-h-64 overflow-y-auto p-2 border rounded-2xl">
                                    {roomData.players.map(p => (
                                        <div key={p.id} className="p-3 border rounded-xl flex items-center gap-3 relative bg-white">
                                            <div className="text-2xl">{AVATARS.find(a=>a.id===p.avatarId)?.icon}</div>
                                            <div className="font-bold text-sm truncate flex-1">{p.name}</div>
                                            {isHost && (
                                                <button onClick={() => kickPlayer(p.id)} className="w-6 h-6 flex items-center justify-center bg-red-100 text-red-600 rounded-full text-xs font-bold hover:bg-red-500 hover:text-white absolute right-2">✕</button>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div className="flex gap-4">
                                <Button variant="outline" onClick={handleLeaveRoom} className="flex-1">Keluar</Button>
                                {isHost && <Button onClick={startGame} className="flex-1 text-lg">Mulai Main Serentak 🚀</Button>}
                                {!isHost && <div className="flex-1 flex items-center justify-center bg-teal-50 text-teal-800 font-bold rounded-full">Menunggu Guru...</div>}
                            </div>
                        </Card>
                    </div>
                );
            };

            const GameBoard = ({ roomData }) => {
                const currentBoardDef = roomData?.board || BOARD_LAYOUTS.classic;
                const cellColors = currentBoardDef.cellColors || ['bg-rose-200', 'bg-amber-200', 'bg-emerald-200', 'bg-sky-200', 'bg-violet-200'];

                // Fungsi untuk menggambar garis SVG untuk Ular & Tangga
                const drawLine = (startCell, endCell, type) => {
                    const s = getCellCoords(startCell);
                    const e = getCellCoords(endCell);
                    const sX = (s.col * 10) + 5;
                    const sY = (s.row * 10) + 5;
                    const eX = (e.col * 10) + 5;
                    const eY = (e.row * 10) + 5;
                    
                    if (type === 'ladder') {
                        return (
                            <line key={`l_${startCell}`} x1={`${sX}%`} y1={`${sY}%`} x2={`${eX}%`} y2={`${eY}%`} 
                                stroke="#16a34a" strokeWidth="3" strokeDasharray="5,5" strokeLinecap="round" opacity="0.8" />
                        );
                    } else {
                        // Ular digambar merah melengkung
                        return (
                            <path key={`s_${startCell}`} d={`M ${sX} ${sY} Q ${(sX+eX)/2 + 5} ${(sY+eY)/2 - 5} ${eX} ${eY}`} 
                                stroke="#dc2626" strokeWidth="4" fill="transparent" strokeLinecap="round" opacity="0.8" />
                        );
                    }
                };

                return (
                    <div className={`relative w-full max-w-2xl mx-auto shadow-2xl rounded-xl p-3 ${currentBoardDef.bgTheme || 'bg-white'}`}>
                        <div className="mb-2 text-center font-bold text-xs opacity-75 uppercase tracking-wider">
                            Papan: {currentBoardDef.name}
                        </div>
                        <div className="board-grid">
                            {/* Kotak Dasar */}
                            {boardCells.map((c) => (
                                <div key={c.num} className={`board-cell ${cellColors[c.num % cellColors.length]} border border-white/40`}>
                                    <span className="absolute top-1 left-1 text-[10px] font-bold opacity-75">{c.num}</span>
                                </div>
                            ))}

                            {/* SVG Overlay Ular & Tangga */}
                            <svg className="svg-overlay" width="100%" height="100%" preserveAspectRatio="none">
                                {Object.entries(currentBoardDef.ladders || {}).map(([s, e]) => drawLine(Number(s), e, 'ladder'))}
                                {Object.entries(currentBoardDef.snakes || {}).map(([s, e]) => drawLine(Number(s), e, 'snake'))}
                            </svg>

                            {/* Token Pemain */}
                            {roomData?.players?.map((p) => {
                                if (p.position === 0) return null;
                                const coord = getCellCoords(p.position);
                                const ava = AVATARS.find(a => a.id === p.avatarId);
                                const sameCellIndex = roomData.players.filter(op => op.position === p.position).findIndex(op => op.id === p.id);
                                let offset = sameCellIndex === 0 ? 'offset-0' : sameCellIndex === 1 ? 'offset-1' : sameCellIndex === 2 ? 'offset-2' : 'offset-3';

                                return (
                                    <div key={p.id} className={`player-token ${ava?.bg} ${offset} ring-2 ring-white`}
                                        style={{ left: `${(coord.col * 10) + 1}%`, top: `${(coord.row * 10) + 1}%`, width: '8%', height: '8%' }}>
                                        <span className="text-sm">{ava?.icon}</span>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            const GamePlay = () => {
                if (!roomData) return null;
                const isTeacher = userRole === 'teacher';
                const myPlayer = isTeacher ? null : roomData.players?.find(p => p.id === user?.uid);
                
                const studentQuestions = myPlayer?.personalQuestions && myPlayer.personalQuestions.length > 0 ? myPlayer.personalQuestions : roomData.questions || [];
                const qIndex = myPlayer?.currentQIndex || 0;
                const currentQuestion = studentQuestions[qIndex % studentQuestions.length] || { q: "Memuat soal...", options: ["A", "B", "C", "D"], answer: 0 }; 

                // Deduping leaderboard UI & Urutkan berdasarkan Skor dan Posisi Kotak
                const sortedPlayers = [...roomData.players].sort((a,b) => b.score - a.score || b.position - a.position);

                return (
                    <div className="min-h-screen bg-slate-100 flex flex-col md:flex-row">
                        <div className="w-full md:w-80 bg-white border-r border-slate-200 flex flex-col h-screen max-h-screen">
                            <div className="p-4 bg-brand-navy text-white">
                                <h2 className="font-display font-bold text-lg">Klasemen Live Serentak</h2>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto p-2 space-y-2">
                                {sortedPlayers.map((p, index) => {
                                    const ava = AVATARS.find(a => a.id === p.avatarId);
                                    const isMe = p.id === user?.uid;
                                    return (
                                        <div key={p.id} className={`flex items-center gap-3 p-2 rounded-lg border ${isMe ? 'border-brand-teal bg-teal-50 shadow-sm' : 'bg-white'}`}>
                                            <div className="font-bold text-slate-400 w-4 text-center">{index + 1}</div>
                                            <div className={`w-10 h-10 rounded-full flex-shrink-0 ${ava?.bg} flex items-center justify-center text-xl`}>{ava?.icon}</div>
                                            <div className="flex-1 min-w-0">
                                                <div className="font-bold text-brand-navy truncate text-sm">{p.name} {isMe ? '(Kamu)' : ''}</div>
                                                <div className="text-[11px] font-bold text-slate-500 flex justify-between">
                                                    <span>Pos: KOTAK {p.position}</span>
                                                    <span className="text-brand-gold">{p.score} PTS</span>
                                                </div>
                                            </div>
                                            {isTeacher && (
                                                <button onClick={() => kickPlayer(p.id)} className="w-8 h-8 flex items-center justify-center bg-red-50 text-red-500 rounded-lg text-xs font-bold hover:bg-red-500 hover:text-white">✕</button>
                                            )}
                                        </div>
                                    )
                                })}
                            </div>

                            <div className="p-3 border-t bg-white">
                                <Button onClick={handleLeaveRoom} variant="outline" className="w-full text-xs py-2">Keluar Game (Bisa Lanjut Nanti)</Button>
                            </div>
                        </div>

                        <div className="flex-1 p-4 flex flex-col h-screen overflow-y-auto relative">
                            <div className="flex-1 flex items-center justify-center mb-6">
                                <GameBoard roomData={roomData} />
                            </div>

                            {/* UI Pengerjaan Soal (Hanya Siswa) */}
                            {!isTeacher && myPlayer?.currentState === 'answering' && !hideQuestion && (
                                <div className="absolute inset-0 z-50 flex items-center justify-center bg-brand-navy bg-opacity-90 p-4 backdrop-blur-sm">
                                    <div className="bg-white rounded-3xl p-8 max-w-xl w-full shadow-2xl relative animate-pulse-fast">
                                        <button onClick={() => setHideQuestion(true)} className="absolute top-4 right-4 bg-slate-100 text-slate-600 px-4 py-2 rounded-xl text-sm font-bold">👁️ Lihat Papan</button>
                                        <span className="bg-brand-gold text-white text-xs font-bold px-3 py-1 rounded-full mb-4 inline-block">Soal Mandiri #{qIndex + 1}</span>
                                        <h3 className="text-xl font-bold text-brand-navy mb-6 leading-relaxed">{currentQuestion.q}</h3>
                                        <div className="grid grid-cols-1 gap-3">
                                            {currentQuestion.options.map((opt, idx) => (
                                                <button key={idx} disabled={isProcessing} onClick={() => submitAnswer(idx)} className="p-4 border-2 rounded-xl text-left font-medium hover:border-brand-teal hover:bg-teal-50 transition-colors">
                                                    <span className="font-bold mr-2 text-slate-400">{String.fromCharCode(65 + idx)}.</span> {opt}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {!isTeacher && myPlayer?.currentState === 'answering' && hideQuestion && (
                                <div className="absolute bottom-10 left-0 w-full flex justify-center z-40">
                                    <Button onClick={() => setHideQuestion(false)} className="px-8 py-4 animate-bounce-short shadow-2xl border-2 border-white">📝 BUKA SOAL LAGI</Button>
                                </div>
                            )}

                            {/* UI Dadu */}
                            {!isTeacher && myPlayer?.currentState === 'rolling' && (
                                <div className="absolute inset-0 z-50 flex items-center justify-center bg-black bg-opacity-40 backdrop-blur-sm">
                                    <Button onClick={rollDice} disabled={isProcessing} className="px-16 py-8 text-3xl animate-bounce-short shadow-2xl border-4 border-white bg-green-500 hover:bg-green-600">
                                        🎲 KOCOK DADU!
                                    </Button>
                                </div>
                            )}

                            {isTeacher && (
                                <div className="absolute bottom-10 right-10 z-40">
                                    <Button variant="danger" className="py-4 shadow-2xl border-2 border-white" onClick={() => updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId), { status: 'finished' })}>Selesaikan Permainan</Button>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            const ResultScreen = () => {
                if(!roomData) return null;
                const sortedPlayers = [...roomData.players].sort((a,b) => b.score - a.score || b.position - a.position);

                return (
                    <div className="min-h-screen bg-brand-navy text-white p-6 flex flex-col items-center justify-center overflow-y-auto">
                        <h1 className="text-5xl font-display font-bold text-brand-gold mb-2">PERMAINAN SELESAI!</h1>
                        <p className="text-slate-300 mb-8">Klasemen Akhir Serentak</p>
                        <div className="w-full max-w-3xl bg-slate-800 rounded-2xl p-6 shadow-2xl">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="text-slate-400 border-b border-slate-700 text-sm">
                                        <th className="p-3">Rank</th><th className="p-3">Siswa</th><th className="p-3 text-center">Posisi Kotak</th><th className="p-3 text-right">Skor Total</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {sortedPlayers.map((p, i) => (
                                        <tr key={p.id} className="border-b border-slate-700">
                                            <td className="p-3 font-bold text-brand-gold">#{i + 1}</td>
                                            <td className="p-3 font-bold flex items-center gap-2"><span>{AVATARS.find(a=>a.id===p.avatarId)?.icon}</span> {p.name}</td>
                                            <td className="p-3 text-center font-bold text-teal-400">Kotak {p.position}</td>
                                            <td className="p-3 text-right font-bold text-xl">{p.score}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                            <div className="mt-6 text-center">
                                <Button onClick={handleLeaveRoom} variant="outline" className="border-white text-white hover:bg-white hover:text-brand-navy">Kembali ke Beranda</Button>
                            </div>
                        </div>
                    </div>
                );
            };

            if (loading) return <div className="min-h-screen flex items-center justify-center text-brand-navy font-bold text-2xl">Memuat Sistem...</div>;

            return (
                <div className="font-sans text-slate-800">
                    {toast && (
                        <div className={`fixed top-4 right-4 z-[100] px-6 py-3 rounded-xl shadow-lg text-white font-bold ${toast.type === 'error' ? 'bg-red-500' : toast.type === 'success' ? 'bg-green-500' : 'bg-brand-navy'}`}>
                            {toast.msg}
                        </div>
                    )}
                    {currentView === 'landing' && LandingScreen()}
                    {currentView === 'teacher_dash' && TeacherDashboard()}
                    {currentView === 'admin_dash' && AdminDashboard()}
                    {currentView === 'join_room' && StudentJoin()}
                    {currentView === 'lobby' && Lobby()}
                    {currentView === 'playing' && GamePlay()}
                    {currentView === 'finished' && ResultScreen()}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><ReactApp /></ErrorBoundary>);
    </script>
</body>
</html>
